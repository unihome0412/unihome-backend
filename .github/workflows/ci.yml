name: UniHome CI/CD - DevSecOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_azure:
        description: >-
          Desplegar a Azure Container Apps. Requiere autorización humana,
          environment azure-dev y UNIHOME_ENABLE_AZURE_CD=true.
        required: false
        default: false
        type: boolean
      run_mongo_only:
        description: >-
          Ejecutar únicamente la validación MongoDB efímera entre los jobs
          manuales; no ejecuta DAST, RESTler ni mutación.
        required: false
        default: false
        type: boolean

# El job deploy-azure es manual y falla cerrado. No se ejecuta en PR/push y
# requiere la variable de repositorio y el environment protegido.
permissions:
  contents: read

concurrency:
  # CI y CD usan grupos distintos: un push a main no cancela un deploy; los
  # deploys manuales se serializan y nunca se cancelan entre sí.
  group: >-
    unihome-devsecops-${{ github.workflow }}-${{ github.event_name }}-${{
    (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_azure == 'true') && 'cd' || 'ci' }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_azure == 'true') }}

jobs:
  detect-changes:
    name: Detect changes (filtrado por jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - name: Checkout completo para detectar la diferencia
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Determinar cambios
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > changes.txt
          else
            git ls-files > changes.txt
          fi
          if grep -Eq '^(src/|tests/|tools/|\.github/|Dockerfile$|\.dockerignore$|UniHome\.Backend\.slnx$|Directory\.Build\.props$|global\.json$|dotnet-tools\.json$)' changes.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(Dockerfile$|\.dockerignore$|src/|Directory\.Build\.props$|\.github/workflows/ci\.yml$)' changes.txt; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          echo "### Archivos modificados" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          head -100 changes.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

  semgrep-sast:
    name: Semgrep SAST
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Semgrep en entorno aislado
        run: |
          python3 -m venv /tmp/semgrep-ci
          /tmp/semgrep-ci/bin/pip install --disable-pip-version-check semgrep
      - name: Analizar reglas de seguridad de C#
        run: |
          mkdir -p reports
          /tmp/semgrep-ci/bin/semgrep scan \
            --config p/security-audit \
            --error --severity ERROR --metrics=off \
            --json --output reports/semgrep.json \
            src tests
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sast-report
          path: reports/semgrep.json
          if-no-files-found: ignore
          retention-days: 7

  build-test:
    name: Build, formato y pruebas (.NET 10)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode

      - name: Build
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror

      - name: Verificar formato
        run: dotnet format UniHome.Backend.slnx --verify-no-changes --no-restore

      - name: Test unit
        run: >-
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults/unit

      - name: Test integration
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults/integration

      - name: Probar la lógica del quality gate
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  dependency-scan:
    name: Dependencias vulnerables (dotnet list package)
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode

      - name: Listar paquetes vulnerables
        run: >-
          dotnet list UniHome.Backend.slnx package --vulnerable --include-transitive
          --format json --output-version 1 > vulnerable-packages.json

      - name: Mostrar resultado
        run: cat vulnerable-packages.json

      - name: Bloquear si hay severidad High o Critical
        run: |
          set -euo pipefail
          if ! jq -e '(.projects | type) == "array"' vulnerable-packages.json > /dev/null 2>&1; then
            echo "::error::vulnerable-packages.json no es JSON válido o no contiene '.projects' como arreglo; no se puede evaluar severidad."
            exit 1
          fi
          if jq -e '
            [
              (.projects[]?.frameworks[]? // empty)
              | (.topLevelPackages[]?, .transitivePackages[]?)
              | .vulnerabilities[]?
              | select(.severity == "High" or .severity == "Critical")
            ] | length > 0
          ' vulnerable-packages.json > /dev/null; then
            echo "::error::Se encontraron paquetes con vulnerabilidades High o Critical."
            jq '
              [
                .projects[]? as $p | $p.frameworks[]?
                | (.topLevelPackages[]?, .transitivePackages[]?)
                | select(.vulnerabilities != null)
                | select(.vulnerabilities[]?.severity == "High" or .vulnerabilities[]?.severity == "Critical")
                | {project: $p.path, id, vulnerabilities}
              ]
            ' vulnerable-packages.json
            exit 1
          fi
          echo "Sin vulnerabilidades High/Critical en dependencias directas o transitivas."

      - name: Upload reporte de dependencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerable-packages-report
          path: vulnerable-packages.json
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Gitleaks - historial completo
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks (CLI fijado por versión y checksum, sin Action con licencia)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Escanear historial completo
        run: |
          set -euo pipefail
          ./gitleaks detect \
            --source . \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            -v

      - name: Upload reporte de Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

  contract-test:
    name: Contract Test (OpenAPI)
    needs: [detect-changes, build-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && needs.build-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore + build
        run: |
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build UniHome.Backend.slnx -c Release --no-restore -warnaserror
      - name: Verificar contratos OpenAPI reales (sin Pact inventado)
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          -c Release --no-build --no-restore
          --filter "FullyQualifiedName~OpenApiTests|FullyQualifiedName~OpenApiDocumentTests|FullyQualifiedName~OpenApiGenderContractTests|FullyQualifiedName~SwaggerUiTests"
          --logger "trx;LogFileName=openapi-contract.trx"
          --results-directory TestResults/contracts
      - name: Guardar contratos verificados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-contract-tests
          path: TestResults/contracts/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  pact-contract:
    name: Contract Test (Pact, requiere contratos reales)
    needs: [detect-changes, contract-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_PACT == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.run_mongo_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACT_CONTRACTS_DIR: ${{ github.workspace }}/pacts
      PACT_PROVIDER_BASE_URL: http://127.0.0.1:5088
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exigir proyecto y contratos Pact reales del consumidor
        run: |
          set -euo pipefail
          if [ ! -f tests/UniHome.PactTests/UniHome.PactTests.csproj ]; then
            echo "::error::No hay suite Pact implementada."
            exit 1
          fi
          if ! compgen -G "$PACT_CONTRACTS_DIR/*.json" > /dev/null; then
            echo "::error::No hay contratos Pact reales en $PACT_CONTRACTS_DIR. El job no se considera aprobado ni se generan contratos desde OpenAPI."
            exit 1
          fi
          if ! curl -fsS "$PACT_PROVIDER_BASE_URL/health/live" > /dev/null; then
            echo "::error::No hay una API UniHome aislada en $PACT_PROVIDER_BASE_URL para verificar Pact."
            exit 1
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Verificar contratos Pact del consumidor contra el proveedor aislado
        run: |
          dotnet test tests/UniHome.PactTests/UniHome.PactTests.csproj \
            -c Release \
            --logger "trx;LogFileName=pact-provider.trx" \
            --results-directory TestResults/pact
      - name: Publicar evidencia Pact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pact-provider-results
          path: TestResults/pact/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  sonarcloud-sast:
    name: SonarCloud SAST (.NET)
    needs: detect-changes
    # PR interno a main: análisis real de PR. Push y manual: solo desde main.
    # Las ramas feature no se analizan como ramas independientes (plan Free).
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_SONAR == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar configuración
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Falta SONAR_TOKEN"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Falta SONAR_PROJECT_KEY"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Falta SONAR_ORGANIZATION"; exit 1; }
      - name: Verificar contexto de GitHub Actions
        run: |
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Head: $GITHUB_HEAD_REF"
            echo "Base: $GITHUB_BASE_REF"
            test -n "$GITHUB_HEAD_REF" || { echo "::error::Falta GITHUB_HEAD_REF en el PR"; exit 1; }
            test "$GITHUB_BASE_REF" = "main" || { echo "::error::El PR no apunta a main"; exit 1; }
          else
            test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Sonar solo analiza main fuera de PR"; exit 1; }
          fi
      - name: Analizar con SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.cobertura.reportsPaths="TestResults/sonar/**/coverage.cobertura.xml" \
            /d:sonar.python.coverage.reportPaths="coverage/python-coverage.xml" \
            /d:sonar.token="$SONAR_TOKEN"
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build UniHome.Backend.slnx -c Release --no-restore
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj \
            -c Release --no-build --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/sonar
          # La cobertura del host/OpenAPI se ejerce en pruebas de integración;
          # se incluye el ensamblado de la API en el mismo reporte del gate.
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj \
            -c Release --no-build --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/sonar
          python3 -m pip install --disable-pip-version-check --only-binary :all: --no-deps coverage==7.17.2
          python3 -m coverage run --source=tools/ci -m unittest discover -s tools/ci -p 'test_*.py'
          mkdir -p coverage
          python3 -m coverage xml -o coverage/python-coverage.xml
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  mongo-db-test:
    name: Database Test (MongoDB efímero, manual)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_MONGO_CI == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        # MongoDB Community 8.0.34, fijado por digest para evitar cambios de tag.
        image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        # El runner Ubuntu 24.04 usa kernel 7.0.x. MongoDB 8.0.34 aplica un
        # guard de TCMalloc para kernels 6.19–7.0.13; en el runner el kernel ya
        # contiene la corrección y este ajuste evita el falso bloqueo. Solo se
        # aplica al contenedor efímero de CI.
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 10s
    env:
      MongoDb__ConnectionString: 'mongodb://127.0.0.1:27017/?directConnection=true&retryWrites=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
      MongoDb__DatabaseName: unihome_ci_verificacion
      MongoDb__ServerSelectionTimeoutSeconds: '5'
      UNIHOME_RUN_MONGO_INTEGRATION_TESTS: '1'
      UNIHOME_MIGRATION_ALLOWED_DATABASES: unihome_ci_verificacion
      UNIHOME_MONGO_CI_LOOPBACK_ONLY: '1'
      MONGO_CI_VERSION: '8.0.34'
      MONGO_CI_DATABASE: unihome_ci_verificacion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validar aislamiento de la conexión de CI
        run: |
          set -euo pipefail
          test "$MongoDb__DatabaseName" = 'unihome_ci_verificacion' || {
            echo "::error::La base de CI debe ser unihome_ci_verificacion."
            exit 1
          }
          test "$UNIHOME_MIGRATION_ALLOWED_DATABASES" = 'unihome_ci_verificacion' || {
            echo "::error::La allowlist de migraciones debe contener solo la base de CI."
            exit 1
          }
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          uri = os.environ["MongoDb__ConnectionString"]
          parsed = urlparse(uri)
          if (
              parsed.scheme != "mongodb"
              or parsed.hostname not in {"127.0.0.1", "localhost", "::1"}
              or parsed.username is not None
              or parsed.password is not None
          ):
              print("::error::La URI de CI debe usar MongoDB directo a loopback y sin credenciales.")
              raise SystemExit(1)
          if parse_qs(parsed.query).get("directConnection", [""])[0].lower() != "true":
              print("::error::La URI de CI debe declarar directConnection=true.")
              raise SystemExit(1)
          print("URI MongoDB de CI limitada a loopback y sin credenciales.")
          PY
      - name: Exigir MongoDB efímero disponible
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.mongo.id }}" \
              mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx '1'; then
              echo "MongoDB efímero disponible (intento ${attempt})."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB efímero no disponible."
          exit 1
      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode
      - name: Build Release
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror
      - name: Inicializar base efímera con M01-001 y M03-001
        id: mongo-migration
        run: |
          set -euo pipefail
          mkdir -p TestResults/mongo
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            apply --database unihome_ci_verificacion --confirm --version M01-001 \
            | tee TestResults/mongo/migration-apply.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            verify --database unihome_ci_verificacion --version M01-001 \
            | tee TestResults/mongo/migration-verify.txt
          grep -F 'Registrada: True' TestResults/mongo/migration-verify.txt
          grep -F 'Checksum coincide: True' TestResults/mongo/migration-verify.txt
          grep -F 'M01 coinciden: True' TestResults/mongo/migration-verify.txt
          grep -F 'Escrituras pendientes: 0' TestResults/mongo/migration-verify.txt
          grep -F 'Resultado: VÁLIDO' TestResults/mongo/migration-verify.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            apply --database unihome_ci_verificacion --confirm --version M03-001 \
            | tee TestResults/mongo/migration-apply-m03.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            verify --database unihome_ci_verificacion --version M03-001 \
            | tee TestResults/mongo/migration-verify-m03.txt
          grep -F 'Registrada: True' TestResults/mongo/migration-verify-m03.txt
          grep -F 'Checksum coincide: True' TestResults/mongo/migration-verify-m03.txt
          grep -F 'Índices M03-001 coinciden: True' TestResults/mongo/migration-verify-m03.txt
          grep -F 'Escrituras pendientes: 0' TestResults/mongo/migration-verify-m03.txt
          grep -F 'Resultado: VÁLIDO' TestResults/mongo/migration-verify-m03.txt
      - name: Pruebas reales contra MongoDB
        id: mongo-tests
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~MongoIdentityPersistenceTests|FullyQualifiedName~MongoPromotionLockPersistenceTests|FullyQualifiedName~MongoPasswordResetPersistenceTests|FullyQualifiedName~MongoUniversityPersistenceTests"
          --logger "trx;LogFileName=mongo-ci.trx"
          --results-directory TestResults/mongo
      - name: Validar evidencias y resumir MongoDB
        if: always()
        env:
          MONGO_CI_INITIALIZATION: ${{ steps.mongo-migration.outcome }}
          MONGO_CI_TEST_OUTCOME: ${{ steps.mongo-tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p TestResults/mongo
          python3 tools/ci/mongo_ci_summary.py \
            --trx TestResults/mongo/mongo-ci.trx \
            --mongo-version "$MONGO_CI_VERSION" \
            --database "$MONGO_CI_DATABASE" \
            --initialization "$MONGO_CI_INITIALIZATION" \
            --tests-outcome "$MONGO_CI_TEST_OUTCOME" \
            | tee TestResults/mongo/mongo-ci-summary.md
      - name: Publicar evidencias MongoDB
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongodb-ci-results
          path: |
            TestResults/mongo/**/*.trx
            TestResults/mongo/migration-*.txt
            TestResults/mongo/mongo-ci-summary.md
          if-no-files-found: error
          retention-days: 7
      - name: Destruir base temporal y verificar limpieza
        if: always()
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mongo.id }}" mongosh --quiet --eval '
            const database = db.getSiblingDB("unihome_ci_verificacion");
            database.dropDatabase();
            if (database.getCollectionNames().length !== 0) {
              throw new Error("La base temporal no quedó vacía.");
            }
          '
          echo "Base temporal eliminada; el contenedor se destruye al terminar el job."

  # Job manual y opcional: no participa en despliegues ni se ejecuta en push/PR.
  mutation-test:
    name: Mutation Test (Stryker.NET, manual)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_MUTATION == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.run_mongo_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restaurar herramienta local desde el manifiesto
        run: dotnet tool restore
      - name: Verificar versión y configuración de Stryker
        run: |
          dotnet tool list --local | grep -F 'dotnet-stryker' | grep -F '5.0.0'
          test -f tests/UniHome.UnitTests/stryker-config.json
      - name: Restaurar dependencias
        run: dotnet restore UniHome.Backend.slnx --locked-mode
      - name: Compilar Release
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror
      - name: Pruebas unitarias previas a mutación
        run: >-
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit-mutation.trx"
          --results-directory TestResults/mutation
      - name: Ejecutar Stryker.NET 5.0.0
        working-directory: tests/UniHome.UnitTests
        run: dotnet stryker --config-file stryker-config.json
      - name: Resumir y validar mutaciones reales
        if: always()
        run: |
          set -o pipefail
          python3 tools/ci/stryker_summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Conservar reportes HTML y JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-mutation-report
          path: |
            tests/UniHome.UnitTests/StrykerOutput/**/reports/mutation-report.html
            tests/UniHome.UnitTests/StrykerOutput/**/reports/mutation-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-test-results
          path: TestResults/mutation/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker Build (sin push ni Azure)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_DOCKER == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir imagen aislada
        run: |
          docker build --tag unihome-ci:${GITHUB_SHA::12} .
          docker save --output unihome-ci.tar unihome-ci:${GITHUB_SHA::12}
      - name: Imagen para Dockle (no registro remoto)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-container-image
          path: unihome-ci.tar
          retention-days: 1

  container-lint:
    name: Docker Container Lint (Dockle)
    needs: [detect-changes, docker-build]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_DOCKER == 'true' && needs.docker-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar imagen construida
        # v4.3.0 lee artefactos v4 de upload-artifact v4.6.2 (mismo protocolo).
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-container-image
      - name: Cargar y auditar imagen
        run: |
          set -euo pipefail
          docker load --input unihome-ci.tar
          curl -fsSL -o dockle.tar.gz \
            https://github.com/goodwithtech/dockle/releases/download/v0.4.15/dockle_0.4.15_Linux-64bit.tar.gz
          tar -xzf dockle.tar.gz dockle
          chmod +x dockle
          ./dockle --exit-code 1 --exit-level FATAL unihome-ci:${GITHUB_SHA::12}

  dast-zap:
    name: DAST (OWASP ZAP) - baseline pasivo aislado
    needs: [detect-changes, build-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_ZAP == 'true' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) && needs.build-test.result == 'success' && github.event.inputs.run_mongo_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        # Misma versión efímera fijada por digest que usa MongoDB CI.
        image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 10s
    env:
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
      ZAP_API_KEY: unihome-dast-zap-loopback
      DAST_TARGET: http://127.0.0.1:5088
      MONGO_DAST_DATABASE: unihome_dast
      MONGO_DAST_CONNECTION_STRING: 'mongodb://127.0.0.1:27017/?directConnection=true&retryWrites=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
      MongoDb__ConnectionString: 'mongodb://127.0.0.1:27017/?directConnection=true&retryWrites=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
      MongoDb__DatabaseName: unihome_dast
      MongoDb__ServerSelectionTimeoutSeconds: '5'
      UNIHOME_MIGRATION_ALLOWED_DATABASES: unihome_dast
      SMTP_DAST_MAILBOX: .dast-mail
      SMTP_PID_FILE: /tmp/unihome-dast-smtp.pid
      API_PID_FILE: /tmp/unihome-dast-api.pid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validar aislamiento de API, MongoDB y SMTP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          target = os.environ["DAST_TARGET"]
          database = os.environ["MONGO_DAST_DATABASE"]
          uri = os.environ["MONGO_DAST_CONNECTION_STRING"]
          parsed = urlparse(uri)
          if target != "http://127.0.0.1:5088":
              raise SystemExit("El objetivo DAST debe ser loopback en el puerto 5088.")
          if database != "unihome_dast":
              raise SystemExit("La base DAST debe ser unihome_dast.")
          if (
              parsed.scheme != "mongodb"
              or parsed.hostname not in {"127.0.0.1", "localhost", "::1"}
              or parsed.username is not None
              or parsed.password is not None
          ):
              raise SystemExit("La URI DAST debe ser MongoDB directo a loopback y sin credenciales.")
          if parse_qs(parsed.query).get("directConnection", [""])[0].lower() != "true":
              raise SystemExit("La URI DAST debe declarar directConnection=true.")
          print("Objetivo, Mongo y base DAST limitados a loopback.")
          PY
          PYTHONPATH=tools/ci python3 - <<'PY'
          import os
          import zap_dast

          if os.environ["ZAP_IMAGE"] != zap_dast.ZAP_IMAGE_REF:
              raise SystemExit("La imagen ZAP del workflow no coincide con el driver.")
          if os.environ["SMTP_DAST_MAILBOX"] != str(zap_dast.MAILBOX_DIR):
              raise SystemExit("El buzón SMTP del workflow no coincide con el driver.")
          print("Imagen ZAP y buzón SMTP coinciden con el driver.")
          PY
      - name: Restaurar y compilar API y migrador
        run: |
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build src/UniHome.Api/UniHome.Api.csproj -c Release --no-restore -warnaserror
          dotnet build tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj -c Release --no-restore -warnaserror
      - name: Exigir MongoDB efímero disponible
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.mongo.id }}" \
              mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx '1'; then
              echo "MongoDB efímero disponible (intento ${attempt})."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB efímero no disponible para DAST."
          exit 1
      - name: Inicializar base efímera DAST con M01-001 y M03-001
        run: |
          set -euo pipefail
          mkdir -p artifacts/dast-zap
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            apply --database "$MONGO_DAST_DATABASE" --confirm --version M01-001 \
            | tee artifacts/dast-zap/migration-apply.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            verify --database "$MONGO_DAST_DATABASE" --version M01-001 \
            | tee artifacts/dast-zap/migration-verify.txt
          grep -F 'Resultado: VÁLIDO' artifacts/dast-zap/migration-verify.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            apply --database "$MONGO_DAST_DATABASE" --confirm --version M03-001 \
            | tee artifacts/dast-zap/migration-apply-m03.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            verify --database "$MONGO_DAST_DATABASE" --version M03-001 \
            | tee artifacts/dast-zap/migration-verify-m03.txt
          grep -F 'Resultado: VÁLIDO' artifacts/dast-zap/migration-verify-m03.txt
      - name: Preparar SMTP de captura local y confianza TLS
        run: |
          set -euo pipefail
          SMTP_DIR="$RUNNER_TEMP/unihome-dast-smtp"
          mkdir -p "$SMTP_DIR" "$SMTP_DAST_MAILBOX"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
            -keyout "$SMTP_DIR/ca-key.pem" -out "$SMTP_DIR/ca-cert.pem" \
            -subj "/CN=UniHome DAST Local CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -keyout "$SMTP_DIR/server-key.pem" -out "$SMTP_DIR/server.csr" \
            -subj "/CN=127.0.0.1"
          openssl x509 -req -in "$SMTP_DIR/server.csr" \
            -CA "$SMTP_DIR/ca-cert.pem" -CAkey "$SMTP_DIR/ca-key.pem" \
            -CAcreateserial -out "$SMTP_DIR/server-cert.pem" -days 2 -sha256 \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nsubjectKeyIdentifier=hash\nauthorityKeyIdentifier=keyid,issuer\n")
          cat "$SMTP_DIR/server-cert.pem" "$SMTP_DIR/ca-cert.pem" \
            > "$SMTP_DIR/server-chain.pem"
          sudo cp "$SMTP_DIR/ca-cert.pem" \
            /usr/local/share/ca-certificates/unihome-dast-ca.crt
          sudo update-ca-certificates
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=587
          python3 -m venv "$RUNNER_TEMP/unihome-dast-venv"
          "$RUNNER_TEMP/unihome-dast-venv/bin/pip" install \
            --disable-pip-version-check --no-input aiosmtpd==1.4.6
      - name: Iniciar SMTP de captura local
        run: |
          set -euo pipefail
          SMTP_DIR="$RUNNER_TEMP/unihome-dast-smtp"
          nohup "$RUNNER_TEMP/unihome-dast-venv/bin/python" \
            tools/ci/dast_smtp_capture.py \
            --host 127.0.0.1 --port 587 \
            --cert "$SMTP_DIR/server-chain.pem" --key "$SMTP_DIR/server-key.pem" \
            > "$RUNNER_TEMP/unihome-dast-smtp.log" 2>&1 &
          echo $! > "$SMTP_PID_FILE"
          for attempt in $(seq 1 20); do
            if [ -f "$SMTP_DAST_MAILBOX/.ready" ]; then
              echo "SMTP de captura disponible (intento ${attempt})."
              exit 0
            fi
            if ! kill -0 "$(cat "$SMTP_PID_FILE")" 2>/dev/null; then
              cat "$RUNNER_TEMP/unihome-dast-smtp.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/unihome-dast-smtp.log"
          exit 1
      - name: Verificar STARTTLS del SMTP local
        run: |
          set -euo pipefail
          SMTP_DIR="$RUNNER_TEMP/unihome-dast-smtp"
          timeout 15 openssl s_client -starttls smtp \
            -connect 127.0.0.1:587 -servername localhost \
            -CAfile "$SMTP_DIR/ca-cert.pem" -verify_return_error -brief \
            < /dev/null > artifacts/dast-zap/smtp-tls-check.txt 2>&1
          grep -E 'Verification: OK|Verify return code: 0' artifacts/dast-zap/smtp-tls-check.txt
      - name: Verificar conexión TLS con MailKit
        env:
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_DIR: /etc/ssl/certs
        run: |
          set -euo pipefail
          PROBE="$RUNNER_TEMP/unihome-smtp-probe"
          rm -rf "$PROBE"
          dotnet new console --name UniHome.SmtpProbe --output "$PROBE" \
            --framework net10.0 --no-restore > /dev/null
          cat > "$PROBE/UniHome.SmtpProbe.csproj" <<'XML'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="MailKit" Version="4.18.2" />
            </ItemGroup>
          </Project>
          XML
          cat > "$PROBE/Program.cs" <<'CS'
          using System.Net.Security;
          using System.Security.Cryptography.X509Certificates;
          using MailKit.Net.Smtp;
          using MailKit.Security;

          Console.WriteLine($"SSL_CERT_FILE={Environment.GetEnvironmentVariable("SSL_CERT_FILE")}");
          Console.WriteLine($"SSL_CERT_DIR={Environment.GetEnvironmentVariable("SSL_CERT_DIR")}");

          static void PrintChain(X509Chain? chain)
          {
              if (chain is null)
              {
                  return;
              }

              foreach (var status in chain.ChainStatus)
              {
                  Console.WriteLine($"chain_status={status.Status}: {status.StatusInformation.Trim()}");
              }

              foreach (var element in chain.ChainElements)
              {
                  Console.WriteLine(
                      $"chain_cert={element.Certificate.Subject} issuer={element.Certificate.Issuer}");
              }
          }

          async Task TryConnect(bool trustAll)
          {
              using var client = new SmtpClient
              {
                  CheckCertificateRevocation = false
              };
              client.ServerCertificateValidationCallback = (_, _, chain, errors) =>
              {
                  Console.WriteLine($"callback_trustAll={trustAll} errors={errors}");
                  PrintChain(chain);
                  return trustAll || errors == SslPolicyErrors.None;
              };

              try
              {
                  await client.ConnectAsync("127.0.0.1", 587, SecureSocketOptions.StartTls);
                  Console.WriteLine($"connect_trustAll={trustAll} result=OK");
                  await client.DisconnectAsync(true);
              }
              catch (Exception exception)
              {
                  Console.WriteLine(
                      $"connect_trustAll={trustAll} exception={exception.GetType().Name}: {exception.Message}");
                  if (exception.InnerException is not null)
                  {
                      Console.WriteLine(
                          $"inner={exception.InnerException.GetType().Name}: {exception.InnerException.Message}");
                  }
              }
          }

          await TryConnect(false);
          await TryConnect(true);
          CS
          dotnet run --project "$PROBE" --configuration Release \
            > artifacts/dast-zap/smtp-mailkit-probe.txt 2>&1
      - name: Iniciar API efímera con MongoDB y SMTP de captura
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Api__EnableSwagger: 'true'
          MongoDb__ConnectionString: 'mongodb://127.0.0.1:27017/?directConnection=true&retryWrites=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
          MongoDb__DatabaseName: unihome_dast
          MongoDb__ServerSelectionTimeoutSeconds: '5'
          Jwt__SigningKey: 'dast-synthetic-jwt-signing-key-not-a-production-secret-0123456789'
          VerificationCode__HmacSecret: 'dast-synthetic-hmac-secret-not-a-production-secret-0123456789'
          Smtp__Host: 127.0.0.1
          Smtp__Port: '587'
          Smtp__UseStartTls: 'true'
          Smtp__CheckCertificateRevocation: 'false'
          Smtp__Username: unihome-dast
          Smtp__Password: synthetic-not-a-secret
          Smtp__FromEmail: no-reply@unihome.test
          Smtp__FromName: UniHome DAST
          Smtp__TimeoutSeconds: '15'
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_DIR: /etc/ssl/certs
        run: |
          set -euo pipefail
          mkdir -p artifacts/dast-zap
          API_DLL="$GITHUB_WORKSPACE/src/UniHome.Api/bin/Release/net10.0/UniHome.Api.dll"
          test -f "$API_DLL"
          (
            cd "$(dirname "$API_DLL")"
            nohup dotnet UniHome.Api.dll --urls "$DAST_TARGET" \
              > "$GITHUB_WORKSPACE/artifacts/dast-zap/api.log" 2>&1 &
            echo $! > "$API_PID_FILE"
          )
          live_code=""
          for attempt in $(seq 1 60); do
            live_code=$(curl -sS -o artifacts/dast-zap/health-live.json \
              -w '%{http_code}' "$DAST_TARGET/health/live" || true)
            if [ "$live_code" = "200" ]; then break; fi
            if ! kill -0 "$(cat "$API_PID_FILE")" 2>/dev/null; then
              sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g' \
                artifacts/dast-zap/api.log | tail -40
              echo "::error::La API DAST terminó antes de responder /health/live."
              exit 1
            fi
            sleep 2
          done
          if [ "$live_code" != "200" ]; then
            echo "::error::La API DAST no respondió /health/live con HTTP 200."
            sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g' \
              artifacts/dast-zap/api.log | tail -40
            exit 1
          fi
          ready_code=$(curl -sS -o artifacts/dast-zap/health-ready.json \
            -w '%{http_code}' "$DAST_TARGET/health/ready" || true)
          if [ "$ready_code" != "200" ]; then
            echo "::error::La API DAST no respondió /health/ready con HTTP 200; MongoDB no está listo."
            cat artifacts/dast-zap/health-ready.json || true
            exit 1
          fi
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "target=$DAST_TARGET"
            echo "mongo_database=$MONGO_DAST_DATABASE"
            echo "health_live_http=$live_code"
            echo "health_ready_http=$ready_code"
            echo "api_pid=$(cat "$API_PID_FILE")"
            echo "smtp_capture=127.0.0.1:587"
          } > artifacts/dast-zap/startup-summary.txt
          sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g; s#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
            artifacts/dast-zap/api.log | tail -40 >> artifacts/dast-zap/startup-summary.txt
      - name: Iniciar ZAP 2.17.0 fijado por versión y digest
        run: |
          set -euo pipefail
          docker pull "$ZAP_IMAGE"
          docker rm -f unihome-zap >/dev/null 2>&1 || true
          docker run --detach --name unihome-zap --network host \
            "$ZAP_IMAGE" \
            zap.sh -daemon -host 0.0.0.0 -port 8090 \
            -config api.key="$ZAP_API_KEY" \
            -config api.addrs.addr.name='.*' \
            -config api.addrs.addr.regex=true
          for attempt in $(seq 1 60); do
            if curl -fsS \
              "http://127.0.0.1:8090/JSON/core/view/version/?apikey=$ZAP_API_KEY" \
              -o artifacts/dast-zap/zap-version.json; then
              echo "ZAP disponible (intento ${attempt})."
              exit 0
            fi
            if ! docker inspect unihome-zap >/dev/null 2>&1; then
              echo "::error::El contenedor ZAP terminó durante el arranque."
              docker logs unihome-zap > artifacts/dast-zap/zap-startup.log 2>&1 || true
              exit 1
            fi
            sleep 2
          done
          echo "::error::ZAP no respondió por la API local en el tiempo esperado."
          docker logs unihome-zap > artifacts/dast-zap/zap-startup.log 2>&1 || true
          exit 1
      - name: Ejecutar baseline pasivo, rutas reales y reportes
        run: |
          set -euo pipefail
          python3 tools/ci/zap_dast.py \
            --target "$DAST_TARGET" \
            --proxy http://127.0.0.1:8090 \
            --zap-api http://127.0.0.1:8090 \
            --zap-api-key "$ZAP_API_KEY" \
            | tee artifacts/dast-zap/dast-console.txt
          test -s artifacts/dast-zap/zap-report.html
          test -s artifacts/dast-zap/zap-report.json
          test -s artifacts/dast-zap/dast-report.md
          test -s artifacts/dast-zap/route-coverage.json
      - name: Detener servicios y verificar limpieza
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/dast-zap
          SUMMARY=artifacts/dast-zap/shutdown-summary.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$SUMMARY"
          if [ -f "$API_PID_FILE" ]; then
            api_pid=$(cat "$API_PID_FILE")
            if kill -0 "$api_pid" 2>/dev/null; then
              kill "$api_pid" 2>/dev/null || true
              for attempt in $(seq 1 20); do
                if ! kill -0 "$api_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              if kill -0 "$api_pid" 2>/dev/null; then
                echo "api_stopped=false" >> "$SUMMARY"
                exit 1
              fi
            fi
            echo "api_stopped=true" >> "$SUMMARY"
          else
            echo "api_stopped=not_started" >> "$SUMMARY"
          fi
          if [ -f "$SMTP_PID_FILE" ]; then
            smtp_pid=$(cat "$SMTP_PID_FILE")
            if kill -0 "$smtp_pid" 2>/dev/null; then
              kill "$smtp_pid" 2>/dev/null || true
              sleep 1
            fi
            if kill -0 "$smtp_pid" 2>/dev/null; then
              echo "smtp_stopped=false" >> "$SUMMARY"
              exit 1
            fi
            echo "smtp_stopped=true" >> "$SUMMARY"
          else
            echo "smtp_stopped=not_started" >> "$SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/unihome-dast-smtp.log" ]; then
            cp "$RUNNER_TEMP/unihome-dast-smtp.log" artifacts/dast-zap/smtp.log
          fi
          SMTP_DIR="$RUNNER_TEMP/unihome-dast-smtp"
          if [ -f "$SMTP_DIR/ca-cert.pem" ]; then
            openssl x509 -in "$SMTP_DIR/ca-cert.pem" -noout -text \
              > artifacts/dast-zap/smtp-ca.txt 2>&1 || true
          fi
          if docker inspect unihome-zap >/dev/null 2>&1; then
            docker rm -f unihome-zap >> "$SUMMARY" 2>&1
            echo "zap_container_removed=true" >> "$SUMMARY"
          else
            echo "zap_container_removed=not_started" >> "$SUMMARY"
          fi
          if docker exec "${{ job.services.mongo.id }}" mongosh --quiet --eval '
            const database = db.getSiblingDB("unihome_dast");
            database.dropDatabase();
            if (database.getCollectionNames().length !== 0) {
              throw new Error("La base DAST no quedó vacía.");
            }
          ' >> "$SUMMARY" 2>&1; then
            echo "mongo_database_dropped=true" >> "$SUMMARY"
          else
            echo "mongo_database_dropped=false" >> "$SUMMARY"
            exit 1
          fi
      - name: Publicar evidencia DAST
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dast-zap-results
          path: artifacts/dast-zap/**
          if-no-files-found: error
          retention-days: 7

  restler-fuzzing:
    name: RESTler Fuzzing - API efímera aislada
    needs: [detect-changes, contract-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_RESTLER == 'true' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) && github.event.inputs.run_mongo_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 10s
    env:
      RESTLER_TAG: v9.3.1
      RESTLER_COMMIT: eaacd92733771d35e90acfb2040fe37d4e5d09b1
      RESTLER_BIN: /tmp/restler-bin
      RESTLER_TARGET: http://127.0.0.1:5088
      MONGO_RESTLER_DATABASE: unihome_restler
      MongoDb__ConnectionString: 'mongodb://127.0.0.1:27017/?directConnection=true&retryWrites=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
      MongoDb__DatabaseName: unihome_restler
      MongoDb__ServerSelectionTimeoutSeconds: '5'
      UNIHOME_MIGRATION_ALLOWED_DATABASES: unihome_restler
      SMTP_DAST_MAILBOX: .dast-mail
      SMTP_PID_FILE: /tmp/unihome-restler-smtp.pid
      API_PID_FILE: /tmp/unihome-restler-api.pid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validar aislamiento de API, MongoDB y RESTler
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          target = os.environ["RESTLER_TARGET"]
          database = os.environ["MONGO_RESTLER_DATABASE"]
          uri = os.environ["MongoDb__ConnectionString"]
          parsed = urlparse(uri)
          if target != "http://127.0.0.1:5088":
              raise SystemExit("El objetivo RESTler debe ser loopback en el puerto 5088.")
          if database != "unihome_restler":
              raise SystemExit("La base RESTler debe ser unihome_restler.")
          if (
              parsed.scheme != "mongodb"
              or parsed.hostname not in {"127.0.0.1", "localhost", "::1"}
              or parsed.username is not None
              or parsed.password is not None
          ):
              raise SystemExit("La URI RESTler debe ser MongoDB directo a loopback y sin credenciales.")
          if parse_qs(parsed.query).get("directConnection", [""])[0].lower() != "true":
              raise SystemExit("La URI RESTler debe declarar directConnection=true.")
          print("Objetivo RESTler y MongoDB limitados a loopback.")
          PY
          test "$RESTLER_TAG" = "v9.3.1"
          test "$RESTLER_COMMIT" = "eaacd92733771d35e90acfb2040fe37d4e5d09b1"
      - name: Restaurar y compilar API y migrador
        run: |
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build src/UniHome.Api/UniHome.Api.csproj -c Release --no-restore -warnaserror
          dotnet build tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj -c Release --no-restore -warnaserror
      - name: Exigir MongoDB efímero disponible
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.mongo.id }}" \
              mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx '1'; then
              echo "MongoDB efímero disponible (intento ${attempt})."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB efímero no disponible para RESTler."
          exit 1
      - name: Inicializar base efímera RESTler con M01-001 y M03-001
        run: |
          set -euo pipefail
          mkdir -p artifacts/restler
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            apply --database "$MONGO_RESTLER_DATABASE" --confirm --version M01-001 \
            | tee artifacts/restler/migration-apply.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            verify --database "$MONGO_RESTLER_DATABASE" --version M01-001 \
            | tee artifacts/restler/migration-verify.txt
          grep -F 'Resultado: VÁLIDO' artifacts/restler/migration-verify.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            apply --database "$MONGO_RESTLER_DATABASE" --confirm --version M03-001 \
            | tee artifacts/restler/migration-apply-m03.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            verify --database "$MONGO_RESTLER_DATABASE" --version M03-001 \
            | tee artifacts/restler/migration-verify-m03.txt
          grep -F 'Resultado: VÁLIDO' artifacts/restler/migration-verify-m03.txt
      - name: Preparar SMTP de captura local y confianza TLS
        run: |
          set -euo pipefail
          SMTP_DIR="$RUNNER_TEMP/unihome-restler-smtp"
          mkdir -p "$SMTP_DIR" "$SMTP_DAST_MAILBOX"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
            -keyout "$SMTP_DIR/ca-key.pem" -out "$SMTP_DIR/ca-cert.pem" \
            -subj "/CN=UniHome RESTler Local CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -keyout "$SMTP_DIR/server-key.pem" -out "$SMTP_DIR/server.csr" \
            -subj "/CN=127.0.0.1"
          openssl x509 -req -in "$SMTP_DIR/server.csr" \
            -CA "$SMTP_DIR/ca-cert.pem" -CAkey "$SMTP_DIR/ca-key.pem" \
            -CAcreateserial -out "$SMTP_DIR/server-cert.pem" -days 2 -sha256 \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nsubjectKeyIdentifier=hash\nauthorityKeyIdentifier=keyid,issuer\n")
          cat "$SMTP_DIR/server-cert.pem" "$SMTP_DIR/ca-cert.pem" \
            > "$SMTP_DIR/server-chain.pem"
          sudo cp "$SMTP_DIR/ca-cert.pem" \
            /usr/local/share/ca-certificates/unihome-restler-ca.crt
          sudo update-ca-certificates
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=587
          python3 -m venv "$RUNNER_TEMP/unihome-restler-venv"
          "$RUNNER_TEMP/unihome-restler-venv/bin/pip" install \
            --disable-pip-version-check --no-input aiosmtpd==1.4.6
      - name: Iniciar SMTP de captura local
        run: |
          set -euo pipefail
          SMTP_DIR="$RUNNER_TEMP/unihome-restler-smtp"
          nohup "$RUNNER_TEMP/unihome-restler-venv/bin/python" \
            tools/ci/dast_smtp_capture.py \
            --host 127.0.0.1 --port 587 \
            --cert "$SMTP_DIR/server-chain.pem" --key "$SMTP_DIR/server-key.pem" \
            > "$RUNNER_TEMP/unihome-restler-smtp.log" 2>&1 &
          echo $! > "$SMTP_PID_FILE"
          for attempt in $(seq 1 20); do
            if [ -f "$SMTP_DAST_MAILBOX/.ready" ]; then
              echo "SMTP de captura disponible (intento ${attempt})."
              exit 0
            fi
            if ! kill -0 "$(cat "$SMTP_PID_FILE")" 2>/dev/null; then
              cat "$RUNNER_TEMP/unihome-restler-smtp.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/unihome-restler-smtp.log"
          exit 1
      - name: Iniciar API efímera para RESTler
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Api__EnableSwagger: 'true'
          MongoDb__ConnectionString: 'mongodb://127.0.0.1:27017/?directConnection=true&retryWrites=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
          MongoDb__DatabaseName: unihome_restler
          MongoDb__ServerSelectionTimeoutSeconds: '5'
          Jwt__SigningKey: 'restler-synthetic-jwt-signing-key-not-a-production-secret-0123456789'
          VerificationCode__HmacSecret: 'restler-synthetic-hmac-secret-not-a-production-secret-0123456789'
          Auth__RateLimit__LoginPermitLimit: '10000'
          Auth__RateLimit__RefreshPermitLimit: '10000'
          Auth__RateLimit__ConfirmEmailPermitLimit: '10000'
          Auth__RateLimit__ResendPermitLimit: '10000'
          Smtp__Host: 127.0.0.1
          Smtp__Port: '587'
          Smtp__UseStartTls: 'true'
          Smtp__CheckCertificateRevocation: 'false'
          Smtp__Username: unihome-restler
          Smtp__Password: synthetic-not-a-secret
          Smtp__FromEmail: no-reply@unihome.test
          Smtp__FromName: UniHome RESTler
          Smtp__TimeoutSeconds: '15'
          SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          SSL_CERT_DIR: /etc/ssl/certs
        run: |
          set -euo pipefail
          mkdir -p artifacts/restler
          API_DLL="$GITHUB_WORKSPACE/src/UniHome.Api/bin/Release/net10.0/UniHome.Api.dll"
          test -f "$API_DLL"
          (
            cd "$(dirname "$API_DLL")"
            nohup dotnet UniHome.Api.dll --urls "$RESTLER_TARGET" \
              > "$GITHUB_WORKSPACE/artifacts/restler/api.log" 2>&1 &
            echo $! > "$API_PID_FILE"
          )
          live_code=""
          for attempt in $(seq 1 60); do
            live_code=$(curl -sS -o artifacts/restler/health-live.json \
              -w '%{http_code}' "$RESTLER_TARGET/health/live" || true)
            if [ "$live_code" = "200" ]; then break; fi
            if ! kill -0 "$(cat "$API_PID_FILE")" 2>/dev/null; then
              sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g' \
                artifacts/restler/api.log | tail -40
              echo "::error::La API RESTler terminó antes de responder /health/live."
              exit 1
            fi
            sleep 2
          done
          if [ "$live_code" != "200" ]; then
            echo "::error::La API RESTler no respondió /health/live con HTTP 200."
            sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g' \
              artifacts/restler/api.log | tail -40
            exit 1
          fi
          ready_code=$(curl -sS -o artifacts/restler/health-ready.json \
            -w '%{http_code}' "$RESTLER_TARGET/health/ready" || true)
          if [ "$ready_code" != "200" ]; then
            echo "::error::La API RESTler no respondió /health/ready con HTTP 200."
            cat artifacts/restler/health-ready.json || true
            exit 1
          fi
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "target=$RESTLER_TARGET"
            echo "mongo_database=$MONGO_RESTLER_DATABASE"
            echo "health_live_http=$live_code"
            echo "health_ready_http=$ready_code"
            echo "api_pid=$(cat "$API_PID_FILE")"
            echo "smtp_capture=127.0.0.1:587"
          } > artifacts/restler/startup-summary.txt
          sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g; s#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
            artifacts/restler/api.log | tail -40 >> artifacts/restler/startup-summary.txt
      - name: Compilar RESTler v9.3.1 fijado por commit
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/restler-src"
          rm -rf "$SRC" "$RESTLER_BIN"
          git clone --depth 1 --branch "$RESTLER_TAG" \
            https://github.com/microsoft/restler-fuzzer.git "$SRC"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$RESTLER_COMMIT"
          python3 "$SRC/build-restler.py" --dest_dir "$RESTLER_BIN" \
            > artifacts/restler/restler-build.txt 2>&1
          test -f "$RESTLER_BIN/restler/Restler.dll"
          {
            echo "tag=$RESTLER_TAG"
            echo "commit=$RESTLER_COMMIT"
            echo "binary=$RESTLER_BIN/restler/Restler.dll"
          } > artifacts/restler/restler-version.txt
      - name: Ejecutar Compile, Test y Fuzz-lean aislados
        env:
          RESTLER_BIN: /tmp/restler-bin
          PYTHON: python3
        run: |
          set -euo pipefail
          bash tools/ci/restler/run-isolated.sh \
            | tee artifacts/restler/restler-console.txt
      - name: Detener servicios y verificar limpieza
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/restler
          SUMMARY=artifacts/restler/shutdown-summary.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$SUMMARY"
          if [ -f "$API_PID_FILE" ]; then
            api_pid=$(cat "$API_PID_FILE")
            if kill -0 "$api_pid" 2>/dev/null; then
              kill "$api_pid" 2>/dev/null || true
              for attempt in $(seq 1 20); do
                if ! kill -0 "$api_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              if kill -0 "$api_pid" 2>/dev/null; then
                echo "api_stopped=false" >> "$SUMMARY"
                exit 1
              fi
            fi
            echo "api_stopped=true" >> "$SUMMARY"
          else
            echo "api_stopped=not_started" >> "$SUMMARY"
          fi
          if [ -f "$SMTP_PID_FILE" ]; then
            smtp_pid=$(cat "$SMTP_PID_FILE")
            if kill -0 "$smtp_pid" 2>/dev/null; then
              kill "$smtp_pid" 2>/dev/null || true
              sleep 1
            fi
            if kill -0 "$smtp_pid" 2>/dev/null; then
              echo "smtp_stopped=false" >> "$SUMMARY"
              exit 1
            fi
            echo "smtp_stopped=true" >> "$SUMMARY"
          else
            echo "smtp_stopped=not_started" >> "$SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/unihome-restler-smtp.log" ]; then
            cp "$RUNNER_TEMP/unihome-restler-smtp.log" artifacts/restler/smtp.log
          fi
          if docker exec "${{ job.services.mongo.id }}" mongosh --quiet --eval '
            const database = db.getSiblingDB("unihome_restler");
            database.dropDatabase();
            if (database.getCollectionNames().length !== 0) {
              throw new Error("La base RESTler no quedó vacía.");
            }
          ' >> "$SUMMARY" 2>&1; then
            echo "mongo_database_dropped=true" >> "$SUMMARY"
          else
            echo "mongo_database_dropped=false" >> "$SUMMARY"
            exit 1
          fi
          rm -rf .restler-state
      - name: Publicar evidencia RESTler
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restler-fuzzing-results
          path: artifacts/restler/**
          if-no-files-found: error
          retention-days: 7

  pr-quality-gate:
    name: PR Quality Gate (controles obligatorios)
    needs: [detect-changes, semgrep-sast, build-test, contract-test, dependency-scan, secret-scan, sonarcloud-sast, mongo-db-test, mutation-test, pact-contract, docker-build, container-lint, dast-zap, restler-fuzzing]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      CODE_CHANGED: ${{ needs.detect-changes.outputs.code }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      RUN_MONGO_ONLY: ${{ github.event.inputs.run_mongo_only }}
      UNIHOME_ENABLE_SONAR: ${{ vars.UNIHOME_ENABLE_SONAR }}
      UNIHOME_ENABLE_MONGO_CI: ${{ vars.UNIHOME_ENABLE_MONGO_CI }}
      UNIHOME_ENABLE_MUTATION: ${{ vars.UNIHOME_ENABLE_MUTATION }}
      UNIHOME_ENABLE_PACT: ${{ vars.UNIHOME_ENABLE_PACT }}
      UNIHOME_ENABLE_DOCKER: ${{ vars.UNIHOME_ENABLE_DOCKER }}
      UNIHOME_ENABLE_ZAP: ${{ vars.UNIHOME_ENABLE_ZAP }}
      UNIHOME_ENABLE_RESTLER: ${{ vars.UNIHOME_ENABLE_RESTLER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Evaluar resultados reales (skipped != passed)
        run: python3 tools/ci/hardening.py --gate

  hardening-report:
    name: Hardening Report (Combinado)
    needs: [detect-changes, semgrep-sast, build-test, contract-test, dependency-scan, secret-scan, sonarcloud-sast, mongo-db-test, mutation-test, pact-contract, docker-build, container-lint, dast-zap, restler-fuzzing, pr-quality-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      CODE_CHANGED: ${{ needs.detect-changes.outputs.code }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      RUN_MONGO_ONLY: ${{ github.event.inputs.run_mongo_only }}
      UNIHOME_ENABLE_SONAR: ${{ vars.UNIHOME_ENABLE_SONAR }}
      UNIHOME_ENABLE_MONGO_CI: ${{ vars.UNIHOME_ENABLE_MONGO_CI }}
      UNIHOME_ENABLE_MUTATION: ${{ vars.UNIHOME_ENABLE_MUTATION }}
      UNIHOME_ENABLE_PACT: ${{ vars.UNIHOME_ENABLE_PACT }}
      UNIHOME_ENABLE_DOCKER: ${{ vars.UNIHOME_ENABLE_DOCKER }}
      UNIHOME_ENABLE_ZAP: ${{ vars.UNIHOME_ENABLE_ZAP }}
      UNIHOME_ENABLE_RESTLER: ${{ vars.UNIHOME_ENABLE_RESTLER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Consolidar estados y documentar skipped / failed
        run: python3 tools/ci/hardening.py --output reports/hardening.md
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unihome-hardening-report
          path: reports/hardening.md
          if-no-files-found: error
          retention-days: 7

  deploy-azure:
    name: Deploy Azure Container Apps (manual y aprobado)
    # Explícito para no heredar el success() implícito del job: los skips de
    # jobs opcionales transitivos (por ejemplo Pact) no deben omitir el deploy.
    # Los needs obligatorios se exigen uno a uno como success.
    needs: [detect-changes, build-test, contract-test, docker-build, container-lint, pr-quality-gate, hardening-report]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.UNIHOME_ENABLE_AZURE_CD == 'true' && inputs.deploy_to_azure == true && github.event.inputs.run_mongo_only != 'true' && needs.detect-changes.outputs.code == 'true' && needs.build-test.result == 'success' && needs.contract-test.result == 'success' && needs.docker-build.result == 'success' && needs.container-lint.result == 'success' && needs.pr-quality-gate.result == 'success' && needs.hardening-report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-dev
    concurrency:
      group: azure-dev-deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      DEPLOY_TO_AZURE: ${{ inputs.deploy_to_azure }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-unihome-dev' }}
      AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME || 'acrunihomedev' }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP || 'unihome-api' }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'eastus' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validar autorización explícita y rama main
        run: |
          set -euo pipefail
          test "${DEPLOY_TO_AZURE:-}" = "true"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          echo "Despliegue autorizado por input manual; environment=azure-dev."
      - name: Autenticar con OIDC (sin credenciales persistentes)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Descargar imagen exacta auditada por Dockle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-container-image
      - name: Publicar imagen etiquetada por SHA en ACR
        run: |
          set -euo pipefail
          IMAGE="${AZURE_ACR_NAME}.azurecr.io/${AZURE_CONTAINER_APP}:${GITHUB_SHA}"
          docker load --input unihome-ci.tar
          docker tag "unihome-ci:${GITHUB_SHA::12}" "$IMAGE"
          az acr login --name "$AZURE_ACR_NAME"
          push_output="$(docker push "$IMAGE" 2>&1)"
          printf '%s\n' "$push_output"
          image_digest="$(printf '%s\n' "$push_output" \
            | sed -n 's/.*digest: \(sha256:[0-9a-f]*\).*/\1/p' \
            | tail -n 1)"
          if [ -z "$image_digest" ]; then
            image_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" 2>/dev/null \
              | sed 's/^.*@//' || true)"
          fi
          if [ -z "$image_digest" ]; then
            echo "::error::No se pudo registrar el digest de la imagen publicada."
            exit 1
          fi
          {
            echo "IMAGE=$IMAGE"
            echo "IMAGE_SHORT=${GITHUB_SHA::12}"
            echo "IMAGE_DIGEST=$image_digest"
          } >> "$GITHUB_ENV"
      - name: Actualizar revisión y ejecutar recuperación verificada
        run: |
          set -euo pipefail

          is_healthy_running_state() {
            case "$1" in
              Running|RunningAtMaxScale) return 0 ;;
              *) return 1 ;;
            esac
          }
          is_terminal_bad_running_state() {
            case "$1" in
              Failed|Stopped|Degraded|Unknown) return 0 ;;
              *) return 1 ;;
            esac
          }

          previous_image="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.template.containers[0].image' -o tsv)"
          previous_revision="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.latestRevisionName' -o tsv)"
          previous_fqdn="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.latestRevisionFqdn' -o tsv)"
          revision_mode="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.configuration.activeRevisionsMode' -o tsv)"
          if [ -z "$previous_image" ] || [ -z "$previous_revision" ] \
            || [ -z "$previous_fqdn" ] || [ "$revision_mode" != "Single" ]; then
            echo "::error::Se requiere imagen/revisión/FQDN y activeRevisionsMode=Single para un rollback seguro."
            exit 1
          fi
          previous_state="$(az containerapp revision show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$previous_revision" \
            --query 'properties.runningState' -o tsv 2>/dev/null || true)"
          previous_health="$(az containerapp revision show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$previous_revision" \
            --query 'properties.healthState' -o tsv 2>/dev/null || true)"
          if ! is_healthy_running_state "$previous_state" \
            || [ "$previous_health" != "Healthy" ]; then
            echo "::error::La revisión anterior no está saludable (runningState=${previous_state:-desconocido}, healthState=${previous_health:-desconocido}); no se inicia el despliegue."
            exit 1
          fi
          previous_healthy=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "https://$previous_fqdn/health/live" > /dev/null \
              && curl --fail --silent --show-error "https://$previous_fqdn/health/ready" > /dev/null; then
              previous_healthy=true
              break
            fi
            echo "La revisión anterior aún no responde health checks (intento ${attempt}/12)."
            sleep 5
          done
          if [ "$previous_healthy" != "true" ]; then
            echo "::error::La revisión anterior no está sana; no se inicia el despliegue."
            exit 1
          fi
          {
            echo "PREVIOUS_IMAGE=$previous_image"
            echo "PREVIOUS_REVISION=$previous_revision"
            echo "PREVIOUS_FQDN=$previous_fqdn"
          } >> "$GITHUB_ENV"

          update_started=false
          rollback_done=false
          rollback() {
            if [ "$rollback_done" = "true" ]; then
              return 0
            fi
            rollback_done=true
            echo "::warning::Restaurando la imagen anterior $previous_image."
            if ! az containerapp update \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --image "$previous_image" \
              --revision-suffix "rb-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; then
              echo "::error::Falló el rollback a la imagen anterior."
              return 1
            fi
            local rollback_revision=""
            local rollback_state=""
            local rollback_health=""
            for attempt in $(seq 1 12); do
              rollback_revision="$(az containerapp show \
                --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
                --query 'properties.latestRevisionName' -o tsv 2>/dev/null || true)"
              if [ -n "$rollback_revision" ]; then
                rollback_state="$(az containerapp revision show \
                  --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
                  --revision "$rollback_revision" \
                  --query 'properties.runningState' -o tsv 2>/dev/null || true)"
                rollback_health="$(az containerapp revision show \
                  --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
                  --revision "$rollback_revision" \
                  --query 'properties.healthState' -o tsv 2>/dev/null || true)"
                if is_healthy_running_state "$rollback_state" \
                  && [ "$rollback_health" = "Healthy" ]; then
                  break
                fi
                if is_terminal_bad_running_state "$rollback_state" \
                  || [ "$rollback_health" = "Unhealthy" ]; then
                  break
                fi
              fi
              sleep 5
            done
            if ! is_healthy_running_state "$rollback_state" \
              || [ "$rollback_health" != "Healthy" ]; then
              echo "::error::El rollback no alcanzó una revisión saludable (runningState=${rollback_state:-desconocido}, healthState=${rollback_health:-desconocido})."
              return 1
            fi
            local rollback_fqdn=""
            for attempt in $(seq 1 12); do
              rollback_fqdn="$(az containerapp show \
                --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
                --query 'properties.latestRevisionFqdn' -o tsv 2>/dev/null || true)"
              if [ -n "$rollback_fqdn" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$rollback_fqdn" ]; then
              echo "::error::El rollback no publicó un FQDN verificable."
              return 1
            fi
            local rollback_healthy=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error "https://$rollback_fqdn/health/live" > /dev/null \
                && curl --fail --silent --show-error "https://$rollback_fqdn/health/ready" > /dev/null; then
                rollback_healthy=true
                break
              fi
              echo "Rollback aún no responde health checks (intento ${attempt}/12)."
              sleep 5
            done
            if [ "$rollback_healthy" != "true" ]; then
              echo "::error::El rollback no superó la verificación de salud."
              return 1
            fi
            echo "Rollback verificado en $rollback_fqdn."
          }
          on_exit() {
            local code=$?
            if [ "$code" -ne 0 ] && [ "$update_started" = "true" ] && [ "$rollback_done" != "true" ]; then
              rollback || true
            fi
            exit "$code"
          }
          trap on_exit EXIT

          update_started=true
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --revision-suffix "sha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          new_revision="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.latestRevisionName' -o tsv)"
          if [ -z "$new_revision" ] || [ "$new_revision" = "$previous_revision" ]; then
            echo "::error::Container Apps no creó una revisión nueva verificable."
            exit 1
          fi

          revision_state=""
          revision_health=""
          for attempt in $(seq 1 30); do
            revision_state="$(az containerapp revision show \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$new_revision" \
              --query 'properties.runningState' -o tsv 2>/dev/null || true)"
            revision_health="$(az containerapp revision show \
              --name "$AZURE_CONTAINER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$new_revision" \
              --query 'properties.healthState' -o tsv 2>/dev/null || true)"
            if is_healthy_running_state "$revision_state" \
              && [ "$revision_health" = "Healthy" ]; then
              break
            fi
            if is_terminal_bad_running_state "$revision_state" \
              || [ "$revision_health" = "Unhealthy" ]; then
              break
            fi
            echo "Revisión $new_revision aún no está saludable (runningState=${revision_state:-desconocido}, healthState=${revision_health:-desconocido})."
            sleep 5
          done
          if ! is_healthy_running_state "$revision_state"; then
            echo "::error::La revisión $new_revision no alcanzó un estado Running/RunningAtMaxScale."
            exit 1
          fi
          if [ "$revision_health" != "Healthy" ]; then
            echo "::error::La revisión $new_revision no alcanzó healthState=Healthy."
            exit 1
          fi

          new_fqdn="$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.latestRevisionFqdn' -o tsv)"
          if [ -z "$new_fqdn" ]; then
            echo "::error::Container Apps no publicó FQDN para la revisión nueva."
            exit 1
          fi

          healthy=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://$new_fqdn/health/live" > /dev/null \
              && curl --fail --silent --show-error "https://$new_fqdn/health/ready" > /dev/null; then
              healthy=true
              break
            fi
            echo "Health check pendiente (intento ${attempt}/30)."
            sleep 10
          done
          if [ "$healthy" != "true" ]; then
            echo "::error::Health checks de la revisión nueva fallaron."
            exit 1
          fi

          update_started=false
          {
            echo "NEW_REVISION=$new_revision"
            echo "HEALTH_FQDN=$new_fqdn"
          } >> "$GITHUB_ENV"
      - name: Resumir evidencia de despliegue
        if: always()
        run: |
          {
            echo "# Azure Container Apps — despliegue manual"
            echo ""
            echo "- Repositorio: \`$GITHUB_REPOSITORY\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Imagen (tag SHA): \`${IMAGE:-no-publicada}\`"
            echo "- Digest registrado: \`${IMAGE_DIGEST:-n/d}\`"
            echo "- Revisión anterior: \`${PREVIOUS_REVISION:-n/d}\`"
            echo "- FQDN anterior: \`${PREVIOUS_FQDN:-n/d}\`"
            echo "- Revisión nueva: \`${NEW_REVISION:-n/d}\`"
            echo "- FQDN nuevo: \`${HEALTH_FQDN:-n/d}\`"
            echo "- Resultado: \`${{ job.status }}\`"
            echo "- Environment: \`azure-dev\`"
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "image=${IMAGE:-}"
            echo "image_digest=${IMAGE_DIGEST:-}"
            echo "previous_revision=${PREVIOUS_REVISION:-}"
            echo "previous_fqdn=${PREVIOUS_FQDN:-}"
            echo "new_revision=${NEW_REVISION:-}"
            echo "health_fqdn=${HEALTH_FQDN:-}"
            echo "result=${{ job.status }}"
          } > azure-deploy-summary.txt
      - name: Publicar evidencia de despliegue
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-cd-evidence
          path: azure-deploy-summary.txt
          if-no-files-found: warn
          retention-days: 7
