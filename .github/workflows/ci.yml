name: UniHome CI/CD - DevSecOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Despliegue CD intencionalmente excluido hasta aprobación y Environment protegido.
permissions:
  contents: read

concurrency:
  group: unihome-devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes (filtrado por jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - name: Checkout completo para detectar la diferencia
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Determinar cambios
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > changes.txt
          else
            git ls-files > changes.txt
          fi
          if grep -Eq '^(src/|tests/|tools/|\.github/|Dockerfile$|\.dockerignore$|UniHome\.Backend\.slnx$|Directory\.Build\.props$|global\.json$|dotnet-tools\.json$)' changes.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(Dockerfile$|\.dockerignore$|src/|Directory\.Build\.props$|\.github/workflows/ci\.yml$)' changes.txt; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          echo "### Archivos modificados" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          head -100 changes.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

  semgrep-sast:
    name: Semgrep SAST
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Semgrep en entorno aislado
        run: |
          python3 -m venv /tmp/semgrep-ci
          /tmp/semgrep-ci/bin/pip install --disable-pip-version-check semgrep
      - name: Analizar reglas de seguridad de C#
        run: |
          mkdir -p reports
          /tmp/semgrep-ci/bin/semgrep scan \
            --config p/security-audit \
            --error --severity ERROR --metrics=off \
            --json --output reports/semgrep.json \
            src tests
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sast-report
          path: reports/semgrep.json
          if-no-files-found: ignore
          retention-days: 7

  build-test:
    name: Build, formato y pruebas (.NET 10)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode

      - name: Build
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror

      - name: Verificar formato
        run: dotnet format UniHome.Backend.slnx --verify-no-changes --no-restore

      - name: Test unit
        run: >-
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults/unit

      - name: Test integration
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults/integration

      - name: Probar la lógica del quality gate
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  dependency-scan:
    name: Dependencias vulnerables (dotnet list package)
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode

      - name: Listar paquetes vulnerables
        run: >-
          dotnet list UniHome.Backend.slnx package --vulnerable --include-transitive
          --format json --output-version 1 > vulnerable-packages.json

      - name: Mostrar resultado
        run: cat vulnerable-packages.json

      - name: Bloquear si hay severidad High o Critical
        run: |
          set -euo pipefail
          if ! jq -e '(.projects | type) == "array"' vulnerable-packages.json > /dev/null 2>&1; then
            echo "::error::vulnerable-packages.json no es JSON válido o no contiene '.projects' como arreglo; no se puede evaluar severidad."
            exit 1
          fi
          if jq -e '
            [
              (.projects[]?.frameworks[]? // empty)
              | (.topLevelPackages[]?, .transitivePackages[]?)
              | .vulnerabilities[]?
              | select(.severity == "High" or .severity == "Critical")
            ] | length > 0
          ' vulnerable-packages.json > /dev/null; then
            echo "::error::Se encontraron paquetes con vulnerabilidades High o Critical."
            jq '
              [
                .projects[]? as $p | $p.frameworks[]?
                | (.topLevelPackages[]?, .transitivePackages[]?)
                | select(.vulnerabilities != null)
                | select(.vulnerabilities[]?.severity == "High" or .vulnerabilities[]?.severity == "Critical")
                | {project: $p.path, id, vulnerabilities}
              ]
            ' vulnerable-packages.json
            exit 1
          fi
          echo "Sin vulnerabilidades High/Critical en dependencias directas o transitivas."

      - name: Upload reporte de dependencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerable-packages-report
          path: vulnerable-packages.json
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Gitleaks - historial completo
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks (CLI fijado por versión y checksum, sin Action con licencia)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Escanear historial completo
        run: |
          set -euo pipefail
          ./gitleaks detect \
            --source . \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            -v

      - name: Upload reporte de Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

  contract-test:
    name: Contract Test (OpenAPI)
    needs: [detect-changes, build-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && needs.build-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore + build
        run: |
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build UniHome.Backend.slnx -c Release --no-restore -warnaserror
      - name: Verificar contratos OpenAPI reales (sin Pact inventado)
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          -c Release --no-build --no-restore
          --filter "FullyQualifiedName~OpenApiTests|FullyQualifiedName~OpenApiDocumentTests|FullyQualifiedName~SwaggerUiTests"
          --logger "trx;LogFileName=openapi-contract.trx"
          --results-directory TestResults/contracts
      - name: Guardar contratos verificados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-contract-tests
          path: TestResults/contracts/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  pact-contract:
    name: Contract Test (Pact, pendiente de contratos)
    needs: [detect-changes, contract-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_PACT == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No simular cumplimiento cuando no hay proyecto Pact
        run: |
          if [ ! -f tests/UniHome.PactTests/UniHome.PactTests.csproj ]; then
            echo "::error::No hay suite Pact implementada. Agregar pruebas de consumidor/proveedor antes de habilitar esta variable."
            exit 1
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/UniHome.PactTests/UniHome.PactTests.csproj -c Release

  sonarcloud-sast:
    name: SonarCloud SAST (.NET)
    needs: detect-changes
    # PR interno a main: análisis real de PR. Push y manual: solo desde main.
    # Las ramas feature no se analizan como ramas independientes (plan Free).
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_SONAR == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar configuración
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Falta SONAR_TOKEN"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Falta SONAR_PROJECT_KEY"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Falta SONAR_ORGANIZATION"; exit 1; }
      - name: Verificar contexto de GitHub Actions
        run: |
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Head: $GITHUB_HEAD_REF"
            echo "Base: $GITHUB_BASE_REF"
            test -n "$GITHUB_HEAD_REF" || { echo "::error::Falta GITHUB_HEAD_REF en el PR"; exit 1; }
            test "$GITHUB_BASE_REF" = "main" || { echo "::error::El PR no apunta a main"; exit 1; }
          else
            test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Sonar solo analiza main fuera de PR"; exit 1; }
          fi
      - name: Analizar con SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.cobertura.reportsPaths="TestResults/sonar/**/coverage.cobertura.xml" \
            /d:sonar.python.coverage.reportPaths="coverage/python-coverage.xml" \
            /d:sonar.token="$SONAR_TOKEN"
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build UniHome.Backend.slnx -c Release --no-restore
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj \
            -c Release --no-build --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/sonar
          python3 -m pip install --disable-pip-version-check --only-binary :all: --no-deps coverage==7.17.2
          python3 -m coverage run --source=tools/ci -m unittest discover -s tools/ci -p 'test_*.py'
          mkdir -p coverage
          python3 -m coverage xml -o coverage/python-coverage.xml
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  mongo-db-test:
    name: Database Test (MongoDB efímero, manual)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_MONGO_CI == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        # MongoDB Community 8.0.34, fijado por digest para evitar cambios de tag.
        image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        # El runner Ubuntu 24.04 usa kernel 7.0.x. MongoDB 8.0.34 aplica un
        # guard de TCMalloc para kernels 6.19–7.0.13; en el runner el kernel ya
        # contiene la corrección y este ajuste evita el falso bloqueo. Solo se
        # aplica al contenedor efímero de CI.
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 10s
    env:
      MongoDb__ConnectionString: 'mongodb://127.0.0.1:27017/?directConnection=true&retryWrites=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
      MongoDb__DatabaseName: unihome_ci_verificacion
      MongoDb__ServerSelectionTimeoutSeconds: '5'
      UNIHOME_RUN_MONGO_INTEGRATION_TESTS: '1'
      UNIHOME_MIGRATION_ALLOWED_DATABASES: unihome_ci_verificacion
      UNIHOME_MONGO_CI_LOOPBACK_ONLY: '1'
      MONGO_CI_VERSION: '8.0.34'
      MONGO_CI_DATABASE: unihome_ci_verificacion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validar aislamiento de la conexión de CI
        run: |
          set -euo pipefail
          test "$MongoDb__DatabaseName" = 'unihome_ci_verificacion' || {
            echo "::error::La base de CI debe ser unihome_ci_verificacion."
            exit 1
          }
          test "$UNIHOME_MIGRATION_ALLOWED_DATABASES" = 'unihome_ci_verificacion' || {
            echo "::error::La allowlist de migraciones debe contener solo la base de CI."
            exit 1
          }
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          uri = os.environ["MongoDb__ConnectionString"]
          parsed = urlparse(uri)
          if (
              parsed.scheme != "mongodb"
              or parsed.hostname not in {"127.0.0.1", "localhost", "::1"}
              or parsed.username is not None
              or parsed.password is not None
          ):
              print("::error::La URI de CI debe usar MongoDB directo a loopback y sin credenciales.")
              raise SystemExit(1)
          if parse_qs(parsed.query).get("directConnection", [""])[0].lower() != "true":
              print("::error::La URI de CI debe declarar directConnection=true.")
              raise SystemExit(1)
          print("URI MongoDB de CI limitada a loopback y sin credenciales.")
          PY
      - name: Exigir MongoDB efímero disponible
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.mongo.id }}" \
              mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx '1'; then
              echo "MongoDB efímero disponible (intento ${attempt})."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB efímero no disponible."
          exit 1
      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode
      - name: Build Release
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror
      - name: Inicializar base efímera con M01-001
        id: mongo-migration
        run: |
          set -euo pipefail
          mkdir -p TestResults/mongo
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            apply --database unihome_ci_verificacion --confirm \
            | tee TestResults/mongo/migration-apply.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            verify --database unihome_ci_verificacion \
            | tee TestResults/mongo/migration-verify.txt
          grep -F 'Registrada: True' TestResults/mongo/migration-verify.txt
          grep -F 'Checksum coincide: True' TestResults/mongo/migration-verify.txt
          grep -F 'M01 coinciden: True' TestResults/mongo/migration-verify.txt
          grep -F 'Escrituras pendientes: 0' TestResults/mongo/migration-verify.txt
          grep -F 'Resultado: VÁLIDO' TestResults/mongo/migration-verify.txt
      - name: Pruebas reales contra MongoDB
        id: mongo-tests
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~MongoIdentityPersistenceTests|FullyQualifiedName~MongoPromotionLockPersistenceTests"
          --logger "trx;LogFileName=mongo-ci.trx"
          --results-directory TestResults/mongo
      - name: Validar evidencias y resumir MongoDB
        if: always()
        env:
          MONGO_CI_INITIALIZATION: ${{ steps.mongo-migration.outcome }}
          MONGO_CI_TEST_OUTCOME: ${{ steps.mongo-tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p TestResults/mongo
          python3 tools/ci/mongo_ci_summary.py \
            --trx TestResults/mongo/mongo-ci.trx \
            --mongo-version "$MONGO_CI_VERSION" \
            --database "$MONGO_CI_DATABASE" \
            --initialization "$MONGO_CI_INITIALIZATION" \
            --tests-outcome "$MONGO_CI_TEST_OUTCOME" \
            | tee TestResults/mongo/mongo-ci-summary.md
      - name: Publicar evidencias MongoDB
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongodb-ci-results
          path: |
            TestResults/mongo/**/*.trx
            TestResults/mongo/migration-*.txt
            TestResults/mongo/mongo-ci-summary.md
          if-no-files-found: error
          retention-days: 7
      - name: Destruir base temporal y verificar limpieza
        if: always()
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mongo.id }}" mongosh --quiet --eval '
            const database = db.getSiblingDB("unihome_ci_verificacion");
            database.dropDatabase();
            if (database.getCollectionNames().length !== 0) {
              throw new Error("La base temporal no quedó vacía.");
            }
          '
          echo "Base temporal eliminada; el contenedor se destruye al terminar el job."

  # Job manual y opcional: no participa en despliegues ni se ejecuta en push/PR.
  mutation-test:
    name: Mutation Test (Stryker.NET, manual)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_MUTATION == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restaurar herramienta local desde el manifiesto
        run: dotnet tool restore
      - name: Verificar versión y configuración de Stryker
        run: |
          dotnet tool list --local | grep -F 'dotnet-stryker' | grep -F '5.0.0'
          test -f tests/UniHome.UnitTests/stryker-config.json
      - name: Restaurar dependencias
        run: dotnet restore UniHome.Backend.slnx --locked-mode
      - name: Compilar Release
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror
      - name: Pruebas unitarias previas a mutación
        run: >-
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit-mutation.trx"
          --results-directory TestResults/mutation
      - name: Ejecutar Stryker.NET 5.0.0
        working-directory: tests/UniHome.UnitTests
        run: dotnet stryker --config-file stryker-config.json
      - name: Resumir y validar mutaciones reales
        if: always()
        run: |
          set -o pipefail
          python3 tools/ci/stryker_summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Conservar reportes HTML y JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-mutation-report
          path: |
            tests/UniHome.UnitTests/StrykerOutput/**/reports/mutation-report.html
            tests/UniHome.UnitTests/StrykerOutput/**/reports/mutation-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-test-results
          path: TestResults/mutation/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker Build (sin push ni Azure)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_DOCKER == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir imagen aislada
        run: |
          docker build --tag unihome-ci:${GITHUB_SHA::12} .
          docker save --output unihome-ci.tar unihome-ci:${GITHUB_SHA::12}
      - name: Imagen para Dockle (no registro remoto)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-container-image
          path: unihome-ci.tar
          retention-days: 1

  container-lint:
    name: Docker Container Lint (Dockle)
    needs: [detect-changes, docker-build]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_DOCKER == 'true' && needs.docker-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar imagen construida
        uses: actions/download-artifact@v4 # etiqueta oficial; fijar SHA antes de producción
        with:
          name: ci-container-image
      - name: Cargar y auditar imagen
        run: |
          set -euo pipefail
          docker load --input unihome-ci.tar
          curl -fsSL -o dockle.tar.gz \
            https://github.com/goodwithtech/dockle/releases/download/v0.4.15/dockle_0.4.15_Linux-64bit.tar.gz
          tar -xzf dockle.tar.gz dockle
          chmod +x dockle
          ./dockle --exit-code 1 --exit-level FATAL unihome-ci:${GITHUB_SHA::12}

  dast-zap:
    name: DAST (OWASP ZAP) - baseline pasivo aislado
    needs: [detect-changes, build-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_ZAP == 'true' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) && needs.build-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        # Misma versión efímera fijada por digest que usa MongoDB CI.
        image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 10s
    env:
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
      ZAP_API_KEY: unihome-dast-zap-loopback
      DAST_TARGET: http://127.0.0.1:5088
      MONGO_DAST_DATABASE: unihome_dast
      MONGO_DAST_CONNECTION_STRING: 'mongodb://127.0.0.1:27017/?directConnection=true&retryWrites=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
      UNIHOME_MIGRATION_ALLOWED_DATABASES: unihome_dast
      SMTP_DAST_MAILBOX: /tmp/unihome-dast-mail
      SMTP_PID_FILE: /tmp/unihome-dast-smtp.pid
      API_PID_FILE: /tmp/unihome-dast-api.pid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validar aislamiento de API, MongoDB y SMTP
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qs, urlparse

          target = os.environ["DAST_TARGET"]
          database = os.environ["MONGO_DAST_DATABASE"]
          uri = os.environ["MONGO_DAST_CONNECTION_STRING"]
          parsed = urlparse(uri)
          if target != "http://127.0.0.1:5088":
              raise SystemExit("El objetivo DAST debe ser loopback en el puerto 5088.")
          if database != "unihome_dast":
              raise SystemExit("La base DAST debe ser unihome_dast.")
          if (
              parsed.scheme != "mongodb"
              or parsed.hostname not in {"127.0.0.1", "localhost", "::1"}
              or parsed.username is not None
              or parsed.password is not None
          ):
              raise SystemExit("La URI DAST debe ser MongoDB directo a loopback y sin credenciales.")
          if parse_qs(parsed.query).get("directConnection", [""])[0].lower() != "true":
              raise SystemExit("La URI DAST debe declarar directConnection=true.")
          print("Objetivo, Mongo y base DAST limitados a loopback.")
          PY
      - name: Restaurar y compilar API y migrador
        run: |
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build src/UniHome.Api/UniHome.Api.csproj -c Release --no-restore -warnaserror
          dotnet build tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj -c Release --no-restore -warnaserror
      - name: Exigir MongoDB efímero disponible
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if docker exec "${{ job.services.mongo.id }}" \
              mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx '1'; then
              echo "MongoDB efímero disponible (intento ${attempt})."
              exit 0
            fi
            sleep 2
          done
          echo "::error::MongoDB efímero no disponible para DAST."
          exit 1
      - name: Inicializar base efímera DAST con M01-001
        run: |
          set -euo pipefail
          mkdir -p artifacts/dast-zap
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            apply --database "$MONGO_DAST_DATABASE" --confirm \
            | tee artifacts/dast-zap/migration-apply.txt
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj \
            --configuration Release --no-build -- \
            verify --database "$MONGO_DAST_DATABASE" \
            | tee artifacts/dast-zap/migration-verify.txt
          grep -F 'Resultado: VÁLIDO' artifacts/dast-zap/migration-verify.txt
      - name: Preparar SMTP de captura local y confianza TLS
        run: |
          set -euo pipefail
          SMTP_DIR="$RUNNER_TEMP/unihome-dast-smtp"
          mkdir -p "$SMTP_DIR" "$SMTP_DAST_MAILBOX"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 2 \
            -keyout "$SMTP_DIR/ca-key.pem" -out "$SMTP_DIR/ca-cert.pem" \
            -subj "/CN=UniHome DAST Local CA"
          openssl req -newkey rsa:2048 -sha256 -nodes \
            -keyout "$SMTP_DIR/server-key.pem" -out "$SMTP_DIR/server.csr" \
            -subj "/CN=localhost"
          openssl x509 -req -in "$SMTP_DIR/server.csr" \
            -CA "$SMTP_DIR/ca-cert.pem" -CAkey "$SMTP_DIR/ca-key.pem" \
            -CAcreateserial -out "$SMTP_DIR/server-cert.pem" -days 2 -sha256 \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n")
          sudo cp "$SMTP_DIR/ca-cert.pem" \
            /usr/local/share/ca-certificates/unihome-dast-ca.crt
          sudo update-ca-certificates
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=587
          python3 -m venv "$RUNNER_TEMP/unihome-dast-venv"
          "$RUNNER_TEMP/unihome-dast-venv/bin/pip" install \
            --disable-pip-version-check --no-input aiosmtpd==1.4.6
      - name: Iniciar SMTP de captura local
        run: |
          set -euo pipefail
          SMTP_DIR="$RUNNER_TEMP/unihome-dast-smtp"
          nohup "$RUNNER_TEMP/unihome-dast-venv/bin/python" \
            tools/ci/dast_smtp_capture.py \
            --host 127.0.0.1 --port 587 \
            --cert "$SMTP_DIR/server-cert.pem" --key "$SMTP_DIR/server-key.pem" \
            --output "$SMTP_DAST_MAILBOX" \
            > "$RUNNER_TEMP/unihome-dast-smtp.log" 2>&1 &
          echo $! > "$SMTP_PID_FILE"
          for attempt in $(seq 1 20); do
            if [ -f "$SMTP_DAST_MAILBOX/.ready" ]; then
              echo "SMTP de captura disponible (intento ${attempt})."
              exit 0
            fi
            if ! kill -0 "$(cat "$SMTP_PID_FILE")" 2>/dev/null; then
              cat "$RUNNER_TEMP/unihome-dast-smtp.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/unihome-dast-smtp.log"
          exit 1
      - name: Iniciar API efímera con MongoDB y SMTP de captura
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Api__EnableSwagger: 'true'
          MongoDb__ConnectionString: 'mongodb://127.0.0.1:27017/?directConnection=true&retryWrites=false&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000'
          MongoDb__DatabaseName: unihome_dast
          MongoDb__ServerSelectionTimeoutSeconds: '5'
          Jwt__SigningKey: 'dast-synthetic-jwt-signing-key-not-a-production-secret-0123456789'
          VerificationCode__HmacSecret: 'dast-synthetic-hmac-secret-not-a-production-secret-0123456789'
          Smtp__Host: 127.0.0.1
          Smtp__Port: '587'
          Smtp__UseStartTls: 'true'
          Smtp__Username: unihome-dast
          Smtp__Password: synthetic-not-a-secret
          Smtp__FromEmail: no-reply@unihome.test
          Smtp__FromName: UniHome DAST
          Smtp__TimeoutSeconds: '15'
          SSL_CERT_FILE: ${{ runner.temp }}/unihome-dast-smtp/ca-cert.pem
        run: |
          set -euo pipefail
          mkdir -p artifacts/dast-zap
          API_DLL="$GITHUB_WORKSPACE/src/UniHome.Api/bin/Release/net10.0/UniHome.Api.dll"
          test -f "$API_DLL"
          (
            cd "$(dirname "$API_DLL")"
            nohup dotnet UniHome.Api.dll --urls "$DAST_TARGET" \
              > "$GITHUB_WORKSPACE/artifacts/dast-zap/api.log" 2>&1 &
            echo $! > "$API_PID_FILE"
          )
          live_code=""
          for attempt in $(seq 1 60); do
            live_code=$(curl -sS -o artifacts/dast-zap/health-live.json \
              -w '%{http_code}' "$DAST_TARGET/health/live" || true)
            if [ "$live_code" = "200" ]; then break; fi
            if ! kill -0 "$(cat "$API_PID_FILE")" 2>/dev/null; then
              sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g' \
                artifacts/dast-zap/api.log | tail -40
              echo "::error::La API DAST terminó antes de responder /health/live."
              exit 1
            fi
            sleep 2
          done
          if [ "$live_code" != "200" ]; then
            echo "::error::La API DAST no respondió /health/live con HTTP 200."
            sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g' \
              artifacts/dast-zap/api.log | tail -40
            exit 1
          fi
          ready_code=$(curl -sS -o artifacts/dast-zap/health-ready.json \
            -w '%{http_code}' "$DAST_TARGET/health/ready" || true)
          if [ "$ready_code" != "200" ]; then
            echo "::error::La API DAST no respondió /health/ready con HTTP 200; MongoDB no está listo."
            cat artifacts/dast-zap/health-ready.json || true
            exit 1
          fi
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "target=$DAST_TARGET"
            echo "mongo_database=$MONGO_DAST_DATABASE"
            echo "health_live_http=$live_code"
            echo "health_ready_http=$ready_code"
            echo "api_pid=$(cat "$API_PID_FILE")"
            echo "smtp_capture=127.0.0.1:587"
          } > artifacts/dast-zap/startup-summary.txt
          sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g; s#(Bearer )[A-Za-z0-9._-]+#\1[REDACTED]#g' \
            artifacts/dast-zap/api.log | tail -40 >> artifacts/dast-zap/startup-summary.txt
      - name: Iniciar ZAP 2.17.0 fijado por versión y digest
        run: |
          set -euo pipefail
          docker pull "$ZAP_IMAGE"
          docker rm -f unihome-zap >/dev/null 2>&1 || true
          docker run --detach --name unihome-zap --network host \
            "$ZAP_IMAGE" \
            zap.sh -daemon -host 0.0.0.0 -port 8090 \
            -config api.key="$ZAP_API_KEY" \
            -config api.addrs.addr.name='.*' \
            -config api.addrs.addr.regex=true
          for attempt in $(seq 1 60); do
            if curl -fsS \
              "http://127.0.0.1:8090/JSON/core/view/version/?apikey=$ZAP_API_KEY" \
              -o artifacts/dast-zap/zap-version.json; then
              echo "ZAP disponible (intento ${attempt})."
              exit 0
            fi
            if ! docker inspect unihome-zap >/dev/null 2>&1; then
              echo "::error::El contenedor ZAP terminó durante el arranque."
              docker logs unihome-zap > artifacts/dast-zap/zap-startup.log 2>&1 || true
              exit 1
            fi
            sleep 2
          done
          echo "::error::ZAP no respondió por la API local en el tiempo esperado."
          docker logs unihome-zap > artifacts/dast-zap/zap-startup.log 2>&1 || true
          exit 1
      - name: Ejecutar baseline pasivo, rutas reales y reportes
        run: |
          set -euo pipefail
          python3 tools/ci/zap_dast.py \
            --target "$DAST_TARGET" \
            --proxy http://127.0.0.1:8090 \
            --zap-api http://127.0.0.1:8090 \
            --zap-api-key "$ZAP_API_KEY" \
            --zap-image "$ZAP_IMAGE" \
            --mailbox "$SMTP_DAST_MAILBOX" \
            --output artifacts/dast-zap \
            | tee artifacts/dast-zap/dast-console.txt
          test -s artifacts/dast-zap/zap-report.html
          test -s artifacts/dast-zap/zap-report.json
          test -s artifacts/dast-zap/dast-report.md
          test -s artifacts/dast-zap/route-coverage.json
      - name: Detener servicios y verificar limpieza
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/dast-zap
          SUMMARY=artifacts/dast-zap/shutdown-summary.txt
          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$SUMMARY"
          if [ -f "$API_PID_FILE" ]; then
            api_pid=$(cat "$API_PID_FILE")
            if kill -0 "$api_pid" 2>/dev/null; then
              kill "$api_pid" 2>/dev/null || true
              for attempt in $(seq 1 20); do
                if ! kill -0 "$api_pid" 2>/dev/null; then break; fi
                sleep 1
              done
              if kill -0 "$api_pid" 2>/dev/null; then
                echo "api_stopped=false" >> "$SUMMARY"
                exit 1
              fi
            fi
            echo "api_stopped=true" >> "$SUMMARY"
          else
            echo "api_stopped=not_started" >> "$SUMMARY"
          fi
          if [ -f "$SMTP_PID_FILE" ]; then
            smtp_pid=$(cat "$SMTP_PID_FILE")
            if kill -0 "$smtp_pid" 2>/dev/null; then
              kill "$smtp_pid" 2>/dev/null || true
              sleep 1
            fi
            if kill -0 "$smtp_pid" 2>/dev/null; then
              echo "smtp_stopped=false" >> "$SUMMARY"
              exit 1
            fi
            echo "smtp_stopped=true" >> "$SUMMARY"
          else
            echo "smtp_stopped=not_started" >> "$SUMMARY"
          fi
          if docker inspect unihome-zap >/dev/null 2>&1; then
            docker rm -f unihome-zap >> "$SUMMARY" 2>&1
            echo "zap_container_removed=true" >> "$SUMMARY"
          else
            echo "zap_container_removed=not_started" >> "$SUMMARY"
          fi
          if docker exec "${{ job.services.mongo.id }}" mongosh --quiet --eval '
            const database = db.getSiblingDB("unihome_dast");
            database.dropDatabase();
            if (database.getCollectionNames().length !== 0) {
              throw new Error("La base DAST no quedó vacía.");
            }
          ' >> "$SUMMARY" 2>&1; then
            echo "mongo_database_dropped=true" >> "$SUMMARY"
          else
            echo "mongo_database_dropped=false" >> "$SUMMARY"
            exit 1
          fi
      - name: Publicar evidencia DAST
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dast-zap-results
          path: artifacts/dast-zap/**
          if-no-files-found: error
          retention-days: 7

  restler-fuzzing:
    name: RESTler Fuzzing (pendiente de harness aislado)
    needs: [detect-changes, contract-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_RESTLER == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No ejecutar fuzzing contra Azure ni contra bases compartidas
        run: |
          if [ ! -f tools/ci/restler/run-isolated.sh ]; then
            echo "::error::Falta harness RESTler con API efímera, contratos OpenAPI y datos aislados. No se ejecuta fuzzing remoto."
            exit 1
          fi
          bash tools/ci/restler/run-isolated.sh

  pr-quality-gate:
    name: PR Quality Gate (controles obligatorios)
    needs: [detect-changes, semgrep-sast, build-test, contract-test, dependency-scan, secret-scan, sonarcloud-sast, mongo-db-test, mutation-test, pact-contract, docker-build, container-lint, dast-zap, restler-fuzzing]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      CODE_CHANGED: ${{ needs.detect-changes.outputs.code }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      UNIHOME_ENABLE_SONAR: ${{ vars.UNIHOME_ENABLE_SONAR }}
      UNIHOME_ENABLE_MONGO_CI: ${{ vars.UNIHOME_ENABLE_MONGO_CI }}
      UNIHOME_ENABLE_MUTATION: ${{ vars.UNIHOME_ENABLE_MUTATION }}
      UNIHOME_ENABLE_PACT: ${{ vars.UNIHOME_ENABLE_PACT }}
      UNIHOME_ENABLE_DOCKER: ${{ vars.UNIHOME_ENABLE_DOCKER }}
      UNIHOME_ENABLE_ZAP: ${{ vars.UNIHOME_ENABLE_ZAP }}
      UNIHOME_ENABLE_RESTLER: ${{ vars.UNIHOME_ENABLE_RESTLER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Evaluar resultados reales (skipped != passed)
        run: python3 tools/ci/hardening.py --gate

  hardening-report:
    name: Hardening Report (Combinado)
    needs: [detect-changes, semgrep-sast, build-test, contract-test, dependency-scan, secret-scan, sonarcloud-sast, mongo-db-test, mutation-test, pact-contract, docker-build, container-lint, dast-zap, restler-fuzzing, pr-quality-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      CODE_CHANGED: ${{ needs.detect-changes.outputs.code }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      UNIHOME_ENABLE_SONAR: ${{ vars.UNIHOME_ENABLE_SONAR }}
      UNIHOME_ENABLE_MONGO_CI: ${{ vars.UNIHOME_ENABLE_MONGO_CI }}
      UNIHOME_ENABLE_MUTATION: ${{ vars.UNIHOME_ENABLE_MUTATION }}
      UNIHOME_ENABLE_PACT: ${{ vars.UNIHOME_ENABLE_PACT }}
      UNIHOME_ENABLE_DOCKER: ${{ vars.UNIHOME_ENABLE_DOCKER }}
      UNIHOME_ENABLE_ZAP: ${{ vars.UNIHOME_ENABLE_ZAP }}
      UNIHOME_ENABLE_RESTLER: ${{ vars.UNIHOME_ENABLE_RESTLER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Consolidar estados y documentar skipped / failed
        run: python3 tools/ci/hardening.py --output reports/hardening.md
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unihome-hardening-report
          path: reports/hardening.md
          if-no-files-found: error
          retention-days: 7
