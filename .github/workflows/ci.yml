name: UniHome CI/CD - DevSecOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Despliegue CD intencionalmente excluido hasta aprobación y Environment protegido.
permissions:
  contents: read

concurrency:
  group: unihome-devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect changes (filtrado por jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - name: Checkout completo para detectar la diferencia
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Determinar cambios
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > changes.txt
          else
            git ls-files > changes.txt
          fi
          if grep -Eq '^(src/|tests/|tools/|\.github/|Dockerfile$|\.dockerignore$|UniHome\.Backend\.slnx$|Directory\.Build\.props$|global\.json$|dotnet-tools\.json$)' changes.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(Dockerfile$|\.dockerignore$|src/|Directory\.Build\.props$|\.github/workflows/ci\.yml$)' changes.txt; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          echo "### Archivos modificados" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          head -100 changes.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

  semgrep-sast:
    name: Semgrep SAST
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Semgrep en entorno aislado
        run: |
          python3 -m venv /tmp/semgrep-ci
          /tmp/semgrep-ci/bin/pip install --disable-pip-version-check semgrep
      - name: Analizar reglas de seguridad de C#
        run: |
          mkdir -p reports
          /tmp/semgrep-ci/bin/semgrep scan \
            --config p/security-audit \
            --error --severity ERROR --metrics=off \
            --json --output reports/semgrep.json \
            src tests
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sast-report
          path: reports/semgrep.json
          if-no-files-found: ignore
          retention-days: 7

  build-test:
    name: Build, formato y pruebas (.NET 10)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode

      - name: Build
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror

      - name: Verificar formato
        run: dotnet format UniHome.Backend.slnx --verify-no-changes --no-restore

      - name: Test unit
        run: >-
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults/unit

      - name: Test integration
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults/integration

      - name: Probar la lógica del quality gate
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  dependency-scan:
    name: Dependencias vulnerables (dotnet list package)
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode

      - name: Listar paquetes vulnerables
        run: >-
          dotnet list UniHome.Backend.slnx package --vulnerable --include-transitive
          --format json --output-version 1 > vulnerable-packages.json

      - name: Mostrar resultado
        run: cat vulnerable-packages.json

      - name: Bloquear si hay severidad High o Critical
        run: |
          set -euo pipefail
          if ! jq -e '(.projects | type) == "array"' vulnerable-packages.json > /dev/null 2>&1; then
            echo "::error::vulnerable-packages.json no es JSON válido o no contiene '.projects' como arreglo; no se puede evaluar severidad."
            exit 1
          fi
          if jq -e '
            [
              (.projects[]?.frameworks[]? // empty)
              | (.topLevelPackages[]?, .transitivePackages[]?)
              | .vulnerabilities[]?
              | select(.severity == "High" or .severity == "Critical")
            ] | length > 0
          ' vulnerable-packages.json > /dev/null; then
            echo "::error::Se encontraron paquetes con vulnerabilidades High o Critical."
            jq '
              [
                .projects[]? as $p | $p.frameworks[]?
                | (.topLevelPackages[]?, .transitivePackages[]?)
                | select(.vulnerabilities != null)
                | select(.vulnerabilities[]?.severity == "High" or .vulnerabilities[]?.severity == "Critical")
                | {project: $p.path, id, vulnerabilities}
              ]
            ' vulnerable-packages.json
            exit 1
          fi
          echo "Sin vulnerabilidades High/Critical en dependencias directas o transitivas."

      - name: Upload reporte de dependencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerable-packages-report
          path: vulnerable-packages.json
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Gitleaks - historial completo
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks (CLI fijado por versión y checksum, sin Action con licencia)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Escanear historial completo
        run: |
          set -euo pipefail
          ./gitleaks detect \
            --source . \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            -v

      - name: Upload reporte de Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

  contract-test:
    name: Contract Test (OpenAPI)
    needs: [detect-changes, build-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && needs.build-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore + build
        run: |
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build UniHome.Backend.slnx -c Release --no-restore -warnaserror
      - name: Verificar contratos OpenAPI reales (sin Pact inventado)
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          -c Release --no-build --no-restore
          --filter "FullyQualifiedName~OpenApiTests|FullyQualifiedName~OpenApiDocumentTests|FullyQualifiedName~SwaggerUiTests"
          --logger "trx;LogFileName=openapi-contract.trx"
          --results-directory TestResults/contracts
      - name: Guardar contratos verificados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-contract-tests
          path: TestResults/contracts/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  pact-contract:
    name: Contract Test (Pact, pendiente de contratos)
    needs: [detect-changes, contract-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_PACT == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No simular cumplimiento cuando no hay proyecto Pact
        run: |
          if [ ! -f tests/UniHome.PactTests/UniHome.PactTests.csproj ]; then
            echo "::error::No hay suite Pact implementada. Agregar pruebas de consumidor/proveedor antes de habilitar esta variable."
            exit 1
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/UniHome.PactTests/UniHome.PactTests.csproj -c Release

  sonarcloud-sast:
    name: SonarCloud SAST (.NET)
    needs: detect-changes
    # PR interno a main: análisis real de PR. Push y manual: solo desde main.
    # Las ramas feature no se analizan como ramas independientes (plan Free).
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_SONAR == 'true' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar configuración
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Falta SONAR_TOKEN"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Falta SONAR_PROJECT_KEY"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Falta SONAR_ORGANIZATION"; exit 1; }
      - name: Verificar contexto de GitHub Actions
        run: |
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Head: $GITHUB_HEAD_REF"
            echo "Base: $GITHUB_BASE_REF"
            test -n "$GITHUB_HEAD_REF" || { echo "::error::Falta GITHUB_HEAD_REF en el PR"; exit 1; }
            test "$GITHUB_BASE_REF" = "main" || { echo "::error::El PR no apunta a main"; exit 1; }
          else
            test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Sonar solo analiza main fuera de PR"; exit 1; }
          fi
      - name: Analizar con SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.cobertura.reportsPaths="TestResults/sonar/**/coverage.cobertura.xml" \
            /d:sonar.python.coverage.reportPaths="coverage/python-coverage.xml" \
            /d:sonar.token="$SONAR_TOKEN"
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build UniHome.Backend.slnx -c Release --no-restore
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj \
            -c Release --no-build --no-restore \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults/sonar
          python3 -m pip install --disable-pip-version-check --only-binary :all: --no-deps coverage==7.17.2
          python3 -m coverage run --source=tools/ci -m unittest discover -s tools/ci -p 'test_*.py'
          mkdir -p coverage
          python3 -m coverage xml -o coverage/python-coverage.xml
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  mongo-db-test:
    name: Database Test (MongoDB aislado, manual)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_MONGO_CI == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --norc --eval 'db.runCommand({ ping: 1 }).ok' | grep -q '^1$'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    env:
      MongoDb__ConnectionString: 'mongodb://127.0.0.1:27017/?connectTimeoutMS=5000&serverSelectionTimeoutMS=5000'
      MongoDb__DatabaseName: unihome_ci_verificacion
      UNIHOME_RUN_MONGO_INTEGRATION_TESTS: '1'
      UNIHOME_MIGRATION_ALLOWED_DATABASES: unihome_ci_verificacion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validar aislamiento de conexión y rechazar URI externa
        run: |
          set -euo pipefail
          if [ "$MongoDb__DatabaseName" != "unihome_ci_verificacion" ]; then
            echo "::error::Base de datos no autorizada para CI: $MongoDb__DatabaseName"
            exit 1
          fi
          if [[ "$MongoDb__ConnectionString" =~ mongodb\+srv: ]] || [[ "$MongoDb__ConnectionString" =~ mongodb\.net ]]; then
            echo "::error::Prohibido conectar a servidores externos o Atlas en CI"
            exit 1
          fi
          if [[ ! "$MongoDb__ConnectionString" =~ ^mongodb://(127\.0\.0\.1|localhost):27017 ]]; then
            echo "::error::La conexión debe apuntar exclusivamente a loopback local (127.0.0.1:27017)"
            exit 1
          fi
          echo "Conexión validada: contenedor efímero local en 127.0.0.1:27017, base unihome_ci_verificacion."
      - name: Verificar disponibilidad del servicio MongoDB
        run: |
          set -euo pipefail
          echo "Esperando socket 127.0.0.1:27017..."
          for i in {1..30}; do
            if bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017' 2>/dev/null; then
              echo "MongoDB listo en el puerto 27017."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Tiempo de espera agotado para conectar a MongoDB en 127.0.0.1:27017"
          exit 1
      - name: Restaurar dependencias (.NET 10)
        run: dotnet restore UniHome.Backend.slnx --locked-mode
      - name: Compilar Release
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror
      - name: Inicializar base efímera M01-001 (plan, apply y verify)
        run: |
          set -euo pipefail
          echo "--- Plan de migración M01-001 ---"
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj -c Release --no-build -- plan --database unihome_ci_verificacion
          echo "--- Aplicación de migración M01-001 ---"
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj -c Release --no-build -- apply --database unihome_ci_verificacion --confirm
          echo "--- Verificación de migración M01-001 ---"
          dotnet run --project tools/UniHome.MongoMigrator/UniHome.MongoMigrator.csproj -c Release --no-build -- verify --database unihome_ci_verificacion
      - name: Pruebas reales de persistencia y lock (MongoDB CI)
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          -c Release --no-restore --no-build
          --filter "FullyQualifiedName~MongoIdentityPersistenceTests|FullyQualifiedName~MongoPromotionLockPersistenceTests"
          --logger "trx;LogFileName=mongo-ci.trx"
          --results-directory TestResults/mongo
      - name: Resumir y validar resultados de pruebas MongoDB (TRX)
        if: always()
        run: |
          set -o pipefail
          python3 tools/ci/mongo_trx_summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Conservar evidencias de MongoDB CI
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongodb-ci-results
          path: TestResults/mongo/**/*.trx
          if-no-files-found: error
          retention-days: 7

  # Job manual y opcional: no participa en despliegues ni se ejecuta en push/PR.
  mutation-test:
    name: Mutation Test (Stryker.NET, manual)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_MUTATION == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restaurar herramienta local desde el manifiesto
        run: dotnet tool restore
      - name: Verificar versión y configuración de Stryker
        run: |
          dotnet tool list --local | grep -F 'dotnet-stryker' | grep -F '5.0.0'
          test -f tests/UniHome.UnitTests/stryker-config.json
      - name: Restaurar dependencias
        run: dotnet restore UniHome.Backend.slnx --locked-mode
      - name: Compilar Release
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror
      - name: Pruebas unitarias previas a mutación
        run: >-
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit-mutation.trx"
          --results-directory TestResults/mutation
      - name: Ejecutar Stryker.NET 5.0.0
        working-directory: tests/UniHome.UnitTests
        run: dotnet stryker --config-file stryker-config.json
      - name: Resumir y validar mutaciones reales
        if: always()
        run: |
          set -o pipefail
          python3 tools/ci/stryker_summary.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Conservar reportes HTML y JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-mutation-report
          path: |
            tests/UniHome.UnitTests/StrykerOutput/**/reports/mutation-report.html
            tests/UniHome.UnitTests/StrykerOutput/**/reports/mutation-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Conservar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-test-results
          path: TestResults/mutation/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker Build (sin push ni Azure)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_DOCKER == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir imagen aislada
        run: |
          docker build --tag unihome-ci:${GITHUB_SHA::12} .
          docker save --output unihome-ci.tar unihome-ci:${GITHUB_SHA::12}
      - name: Imagen para Dockle (no registro remoto)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-container-image
          path: unihome-ci.tar
          retention-days: 1

  container-lint:
    name: Docker Container Lint (Dockle)
    needs: [detect-changes, docker-build]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_DOCKER == 'true' && needs.docker-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar imagen construida
        uses: actions/download-artifact@v4 # etiqueta oficial; fijar SHA antes de producción
        with:
          name: ci-container-image
      - name: Cargar y auditar imagen
        run: |
          set -euo pipefail
          docker load --input unihome-ci.tar
          curl -fsSL -o dockle.tar.gz \
            https://github.com/goodwithtech/dockle/releases/download/v0.4.15/dockle_0.4.15_Linux-64bit.tar.gz
          tar -xzf dockle.tar.gz dockle
          chmod +x dockle
          ./dockle --exit-code 1 --exit-level FATAL unihome-ci:${GITHUB_SHA::12}

  dast-zap:
    name: DAST (OWASP ZAP) - instancia efímera local
    needs: [detect-changes, build-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_ZAP == 'true' && github.event_name == 'workflow_dispatch' && needs.build-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar sin configuración real de MongoDB
        run: |
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build src/UniHome.Api/UniHome.Api.csproj -c Release --no-restore
      - name: Iniciar API local sin secretos ni servicios reales
        env:
          ASPNETCORE_ENVIRONMENT: Development
          MongoDb__ConnectionString: ''
          MongoDb__DatabaseName: ''
          SMTP__Password: ''
        run: |
          nohup dotnet run --project src/UniHome.Api/UniHome.Api.csproj \
            -c Release --no-build --no-launch-profile \
            --urls http://127.0.0.1:5088 > /tmp/unihome-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5088/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::La API local no levantó para ZAP"
          sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g' /tmp/unihome-api.log | tail -30
          exit 1
      - name: ZAP baseline pasivo (solo loopback, sin ataques de escritura)
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:5088/health/live \
            -m 1 -I -r zap.html -J zap.json
      - name: Evidencia ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-baseline-report
          path: zap-reports/*
          if-no-files-found: ignore
          retention-days: 7

  restler-fuzzing:
    name: RESTler Fuzzing (pendiente de harness aislado)
    needs: [detect-changes, contract-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_RESTLER == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No ejecutar fuzzing contra Azure ni contra bases compartidas
        run: |
          if [ ! -f tools/ci/restler/run-isolated.sh ]; then
            echo "::error::Falta harness RESTler con API efímera, contratos OpenAPI y datos aislados. No se ejecuta fuzzing remoto."
            exit 1
          fi
          bash tools/ci/restler/run-isolated.sh

  pr-quality-gate:
    name: PR Quality Gate (controles obligatorios)
    needs: [detect-changes, semgrep-sast, build-test, contract-test, dependency-scan, secret-scan, sonarcloud-sast, mongo-db-test, mutation-test, pact-contract, docker-build, container-lint, dast-zap, restler-fuzzing]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      CODE_CHANGED: ${{ needs.detect-changes.outputs.code }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      UNIHOME_ENABLE_SONAR: ${{ vars.UNIHOME_ENABLE_SONAR }}
      UNIHOME_ENABLE_MONGO_CI: ${{ vars.UNIHOME_ENABLE_MONGO_CI }}
      UNIHOME_ENABLE_MUTATION: ${{ vars.UNIHOME_ENABLE_MUTATION }}
      UNIHOME_ENABLE_PACT: ${{ vars.UNIHOME_ENABLE_PACT }}
      UNIHOME_ENABLE_DOCKER: ${{ vars.UNIHOME_ENABLE_DOCKER }}
      UNIHOME_ENABLE_ZAP: ${{ vars.UNIHOME_ENABLE_ZAP }}
      UNIHOME_ENABLE_RESTLER: ${{ vars.UNIHOME_ENABLE_RESTLER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Evaluar resultados reales (skipped != passed)
        run: python3 tools/ci/hardening.py --gate

  hardening-report:
    name: Hardening Report (Combinado)
    needs: [detect-changes, semgrep-sast, build-test, contract-test, dependency-scan, secret-scan, sonarcloud-sast, mongo-db-test, mutation-test, pact-contract, docker-build, container-lint, dast-zap, restler-fuzzing, pr-quality-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      CODE_CHANGED: ${{ needs.detect-changes.outputs.code }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      UNIHOME_ENABLE_SONAR: ${{ vars.UNIHOME_ENABLE_SONAR }}
      UNIHOME_ENABLE_MONGO_CI: ${{ vars.UNIHOME_ENABLE_MONGO_CI }}
      UNIHOME_ENABLE_MUTATION: ${{ vars.UNIHOME_ENABLE_MUTATION }}
      UNIHOME_ENABLE_PACT: ${{ vars.UNIHOME_ENABLE_PACT }}
      UNIHOME_ENABLE_DOCKER: ${{ vars.UNIHOME_ENABLE_DOCKER }}
      UNIHOME_ENABLE_ZAP: ${{ vars.UNIHOME_ENABLE_ZAP }}
      UNIHOME_ENABLE_RESTLER: ${{ vars.UNIHOME_ENABLE_RESTLER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Consolidar estados y documentar skipped / failed
        run: python3 tools/ci/hardening.py --output reports/hardening.md
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unihome-hardening-report
          path: reports/hardening.md
          if-no-files-found: error
          retention-days: 7
