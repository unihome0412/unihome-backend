name: UniHome CI/CD - DevSecOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      azure_deploy:
        description: 'Solicitar despliegue a Azure DEV (requiere aprobación)'
        type: boolean
        required: true
        default: false
      confirm_target:
        description: 'Para desplegar escribir exactamente DESPLEGAR_UNIHOME_DEV'
        type: string
        required: false
        default: ''

# CD Azure DEV: solo dispatch manual de main + confirmación exacta + Environment protegido + CI verde.
permissions:
  contents: read

# Un push a main NO debe cancelar una publicación manual que ya empezó.
concurrency:
  group: unihome-devsecops-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.azure_deploy == true && 'deploy' || 'ci' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.azure_deploy == true) }}

jobs:
  detect-changes:
    name: Detect changes (filtrado por jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - name: Checkout completo para detectar la diferencia
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Determinar cambios
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD > changes.txt
          else
            git ls-files > changes.txt
          fi
          if grep -Eq '^(src/|tests/|tools/|\.github/|Dockerfile$|\.dockerignore$|UniHome\.Backend\.slnx$|Directory\.Build\.props$|global\.json$)' changes.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(Dockerfile$|\.dockerignore$|src/|Directory\.Build\.props$|\.github/workflows/ci\.yml$)' changes.txt; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi
          echo "### Archivos modificados" >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          head -100 changes.txt >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"

  semgrep-sast:
    name: Semgrep SAST
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Instalar Semgrep en entorno aislado
        run: |
          python3 -m venv /tmp/semgrep-ci
          /tmp/semgrep-ci/bin/pip install --disable-pip-version-check semgrep
      - name: Analizar reglas de seguridad de C#
        run: |
          mkdir -p reports
          /tmp/semgrep-ci/bin/semgrep scan \
            --config p/security-audit \
            --error --severity ERROR --metrics=off \
            --json --output reports/semgrep.json \
            src tests
      - name: Conservar evidencia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sast-report
          path: reports/semgrep.json
          if-no-files-found: ignore
          retention-days: 7

  build-test:
    name: Build, formato y pruebas (.NET 10)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode

      - name: Build
        run: dotnet build UniHome.Backend.slnx --configuration Release --no-restore -warnaserror

      - name: Verificar formato
        run: dotnet format UniHome.Backend.slnx --verify-no-changes --no-restore

      - name: Test unit
        run: >-
          dotnet test tests/UniHome.UnitTests/UniHome.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults/unit

      - name: Test integration
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults/integration

      - name: Probar la lógica del quality gate
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  dependency-scan:
    name: Dependencias vulnerables (dotnet list package)
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore UniHome.Backend.slnx --locked-mode

      - name: Listar paquetes vulnerables
        run: >-
          dotnet list UniHome.Backend.slnx package --vulnerable --include-transitive
          --format json --output-version 1 > vulnerable-packages.json

      - name: Mostrar resultado
        run: cat vulnerable-packages.json

      - name: Bloquear si hay severidad High o Critical
        run: |
          set -euo pipefail
          if ! jq -e '(.projects | type) == "array"' vulnerable-packages.json > /dev/null 2>&1; then
            echo "::error::vulnerable-packages.json no es JSON válido o no contiene '.projects' como arreglo; no se puede evaluar severidad."
            exit 1
          fi
          if jq -e '
            [
              (.projects[]?.frameworks[]? // empty)
              | (.topLevelPackages[]?, .transitivePackages[]?)
              | .vulnerabilities[]?
              | select(.severity == "High" or .severity == "Critical")
            ] | length > 0
          ' vulnerable-packages.json > /dev/null; then
            echo "::error::Se encontraron paquetes con vulnerabilidades High o Critical."
            jq '
              [
                .projects[]? as $p | $p.frameworks[]?
                | (.topLevelPackages[]?, .transitivePackages[]?)
                | select(.vulnerabilities != null)
                | select(.vulnerabilities[]?.severity == "High" or .vulnerabilities[]?.severity == "Critical")
                | {project: $p.path, id, vulnerabilities}
              ]
            ' vulnerable-packages.json
            exit 1
          fi
          echo "Sin vulnerabilidades High/Critical en dependencias directas o transitivas."

      - name: Upload reporte de dependencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerable-packages-report
          path: vulnerable-packages.json
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Gitleaks - historial completo
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks (CLI fijado por versión y checksum, sin Action con licencia)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Escanear historial completo
        run: |
          set -euo pipefail
          ./gitleaks detect \
            --source . \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            -v

      - name: Upload reporte de Gitleaks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

  contract-test:
    name: Contract Test (OpenAPI)
    needs: [detect-changes, build-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && needs.build-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore + build
        run: |
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build UniHome.Backend.slnx -c Release --no-restore -warnaserror
      - name: Verificar contratos OpenAPI reales (sin Pact inventado)
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          -c Release --no-build --no-restore
          --filter "FullyQualifiedName~OpenApiTests|FullyQualifiedName~OpenApiDocumentTests|FullyQualifiedName~SwaggerUiTests"
          --logger "trx;LogFileName=openapi-contract.trx"
          --results-directory TestResults/contracts
      - name: Guardar contratos verificados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openapi-contract-tests
          path: TestResults/contracts/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  pact-contract:
    name: Contract Test (Pact, pendiente de contratos)
    needs: [detect-changes, contract-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_PACT == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No simular cumplimiento cuando no hay proyecto Pact
        run: |
          if [ ! -f tests/UniHome.PactTests/UniHome.PactTests.csproj ]; then
            echo "::error::No hay suite Pact implementada. Agregar pruebas de consumidor/proveedor antes de habilitar esta variable."
            exit 1
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/UniHome.PactTests/UniHome.PactTests.csproj -c Release

  sonarcloud-sast:
    name: SonarCloud SAST (.NET)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_SONAR == 'true' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Verificar configuración
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::Falta SONAR_TOKEN"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Falta SONAR_PROJECT_KEY"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Falta SONAR_ORGANIZATION"; exit 1; }
      - name: Analizar con SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.token="$SONAR_TOKEN"
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build UniHome.Backend.slnx -c Release --no-restore
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

  mongo-db-test:
    name: Database Test (MongoDB aislado, manual)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_MONGO_CI == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MongoDb__ConnectionString: ${{ secrets.UNIHOME_CI_MONGO_URI }}
      MongoDb__DatabaseName: unihome_ci_verificacion
      UNIHOME_RUN_MONGO_INTEGRATION_TESTS: '1'
      UNIHOME_MIGRATION_ALLOWED_DATABASES: unihome_ci_verificacion
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Exigir conexión y base de CI ya migrada M01-001
        run: |
          test -n "$MongoDb__ConnectionString" || { echo "::error::Falta UNIHOME_CI_MONGO_URI"; exit 1; }
          if [ "$MongoDb__DatabaseName" != 'unihome_ci_verificacion' ]; then exit 1; fi
          echo "La base exclusiva debe existir y tener M01-001. No se aplican migraciones aquí."
      - run: dotnet restore UniHome.Backend.slnx --locked-mode
      - name: Pruebas reales de persistencia y lock (escriben en la base CI)
        run: >-
          dotnet test tests/UniHome.IntegrationTests/UniHome.IntegrationTests.csproj
          -c Release --no-restore
          --filter "FullyQualifiedName~MongoIdentityPersistenceTests|FullyQualifiedName~MongoPromotionLockPersistenceTests"
          --logger "trx;LogFileName=mongo-ci.trx"
          --results-directory TestResults/mongo
      - name: Evidencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongodb-ci-results
          path: TestResults/mongo/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  mutation-test:
    name: Mutation Test (Stryker.NET, manual)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_MUTATION == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Stryker mutación real
        working-directory: tests/UniHome.UnitTests
        run: |
          dotnet tool install --global dotnet-stryker
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet stryker --solution ../../UniHome.Backend.slnx
      - name: Conservar reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-mutation-report
          path: tests/UniHome.UnitTests/StrykerOutput/**/*
          if-no-files-found: ignore
          retention-days: 7

  docker-build:
    name: Docker Build (sin push ni Azure)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_DOCKER == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Construir imagen aislada
        run: |
          docker build --tag unihome-ci:${GITHUB_SHA::12} .
          docker save --output unihome-ci.tar unihome-ci:${GITHUB_SHA::12}
      - name: Imagen para Dockle (no registro remoto)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-container-image
          path: unihome-ci.tar
          retention-days: 1

  container-lint:
    name: Docker Container Lint (Dockle)
    needs: [detect-changes, docker-build]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_DOCKER == 'true' && needs.docker-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar imagen construida
        uses: actions/download-artifact@v4 # etiqueta oficial; fijar SHA antes de producción
        with:
          name: ci-container-image
      - name: Cargar y auditar imagen
        run: |
          set -euo pipefail
          docker load --input unihome-ci.tar
          curl -fsSL -o dockle.tar.gz \
            https://github.com/goodwithtech/dockle/releases/download/v0.4.15/dockle_0.4.15_Linux-64bit.tar.gz
          tar -xzf dockle.tar.gz dockle
          chmod +x dockle
          ./dockle --exit-code 1 --exit-level FATAL unihome-ci:${GITHUB_SHA::12}

  dast-zap:
    name: DAST (OWASP ZAP) - instancia efímera local
    needs: [detect-changes, build-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_ZAP == 'true' && github.event_name == 'workflow_dispatch' && needs.build-test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Compilar sin configuración real de MongoDB
        run: |
          dotnet restore UniHome.Backend.slnx --locked-mode
          dotnet build src/UniHome.Api/UniHome.Api.csproj -c Release --no-restore
      - name: Iniciar API local sin secretos ni servicios reales
        env:
          ASPNETCORE_ENVIRONMENT: Development
          MongoDb__ConnectionString: ''
          MongoDb__DatabaseName: ''
          SMTP__Password: ''
        run: |
          nohup dotnet run --project src/UniHome.Api/UniHome.Api.csproj \
            -c Release --no-build --no-launch-profile \
            --urls http://127.0.0.1:5088 > /tmp/unihome-api.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5088/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::La API local no levantó para ZAP"
          sed -E 's#mongodb(\+srv)?://[^[:space:]]+#mongodb://[REDACTED]#g' /tmp/unihome-api.log | tail -30
          exit 1
      - name: ZAP baseline pasivo (solo loopback, sin ataques de escritura)
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:5088/health/live \
            -m 1 -I -r zap.html -J zap.json
      - name: Evidencia ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-baseline-report
          path: zap-reports/*
          if-no-files-found: ignore
          retention-days: 7

  restler-fuzzing:
    name: RESTler Fuzzing (pendiente de harness aislado)
    needs: [detect-changes, contract-test]
    if: ${{ needs.detect-changes.outputs.code == 'true' && vars.UNIHOME_ENABLE_RESTLER == 'true' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No ejecutar fuzzing contra Azure ni contra bases compartidas
        run: |
          if [ ! -f tools/ci/restler/run-isolated.sh ]; then
            echo "::error::Falta harness RESTler con API efímera, contratos OpenAPI y datos aislados. No se ejecuta fuzzing remoto."
            exit 1
          fi
          bash tools/ci/restler/run-isolated.sh

  pr-quality-gate:
    name: PR Quality Gate (controles obligatorios)
    needs: [detect-changes, semgrep-sast, build-test, contract-test, dependency-scan, secret-scan, sonarcloud-sast, mongo-db-test, mutation-test, pact-contract, docker-build, container-lint, dast-zap, restler-fuzzing]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      CODE_CHANGED: ${{ needs.detect-changes.outputs.code }}
      EVENT_NAME: ${{ github.event_name }}
      UNIHOME_ENABLE_SONAR: ${{ vars.UNIHOME_ENABLE_SONAR }}
      UNIHOME_ENABLE_MONGO_CI: ${{ vars.UNIHOME_ENABLE_MONGO_CI }}
      UNIHOME_ENABLE_MUTATION: ${{ vars.UNIHOME_ENABLE_MUTATION }}
      UNIHOME_ENABLE_PACT: ${{ vars.UNIHOME_ENABLE_PACT }}
      UNIHOME_ENABLE_DOCKER: ${{ vars.UNIHOME_ENABLE_DOCKER }}
      UNIHOME_ENABLE_ZAP: ${{ vars.UNIHOME_ENABLE_ZAP }}
      UNIHOME_ENABLE_RESTLER: ${{ vars.UNIHOME_ENABLE_RESTLER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Evaluar resultados reales (skipped != passed)
        run: python3 tools/ci/hardening.py --gate

  hardening-report:
    name: Hardening Report (Combinado)
    needs: [detect-changes, semgrep-sast, build-test, contract-test, dependency-scan, secret-scan, sonarcloud-sast, mongo-db-test, mutation-test, pact-contract, docker-build, container-lint, dast-zap, restler-fuzzing, pr-quality-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
      CODE_CHANGED: ${{ needs.detect-changes.outputs.code }}
      EVENT_NAME: ${{ github.event_name }}
      UNIHOME_ENABLE_SONAR: ${{ vars.UNIHOME_ENABLE_SONAR }}
      UNIHOME_ENABLE_MONGO_CI: ${{ vars.UNIHOME_ENABLE_MONGO_CI }}
      UNIHOME_ENABLE_MUTATION: ${{ vars.UNIHOME_ENABLE_MUTATION }}
      UNIHOME_ENABLE_PACT: ${{ vars.UNIHOME_ENABLE_PACT }}
      UNIHOME_ENABLE_DOCKER: ${{ vars.UNIHOME_ENABLE_DOCKER }}
      UNIHOME_ENABLE_ZAP: ${{ vars.UNIHOME_ENABLE_ZAP }}
      UNIHOME_ENABLE_RESTLER: ${{ vars.UNIHOME_ENABLE_RESTLER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Consolidar estados y documentar skipped / failed
        run: python3 tools/ci/hardening.py --output reports/hardening.md
      - name: Guardar reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unihome-hardening-report
          path: reports/hardening.md
          if-no-files-found: error
          retention-days: 7

  validate-azure-deploy-request:
    name: Azure DEV - Validar solicitud manual
    needs: pr-quality-gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.azure_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exigir main, CI verde y confirmación literal
        env:
          GIT_REF: ${{ github.ref }}
          CONFIRMATION: ${{ inputs.confirm_target }}
          GATE_RESULT: ${{ needs.pr-quality-gate.result }}
        run: |
          set -euo pipefail
          [ "$GIT_REF" = 'refs/heads/main' ] || { echo '::error::Solo se permite deploy desde main'; exit 1; }
          [ "$GATE_RESULT" = 'success' ] || { echo '::error::Quality Gate no aprobó'; exit 1; }
          [ "$CONFIRMATION" = 'DESPLEGAR_UNIHOME_DEV' ] || { echo '::error::Confirmación exacta incorrecta'; exit 1; }
          echo 'Confirmación manual válida. Se verificará Environment azure-dev.'

  # El CD aparece en el mismo grafo. En PR, push y ejecuciones manuales sin
  # confirmación queda Skipped y NO interactúa con Azure.
  deploy-azure-dev:
    name: Deploy Azure DEV (Container Apps, aprobación manual)
    needs: [pr-quality-gate, hardening-report, validate-azure-deploy-request]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          inputs.azure_deploy == true &&
          needs.validate-azure-deploy-request.result == 'success' &&
          needs.pr-quality-gate.result == 'success' &&
          needs.hardening-report.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: unihome-azure-dev-deploy
      cancel-in-progress: false
    environment:
      name: azure-dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: rg-unihome-dev
      AZURE_CONTAINER_APP: unihome-api
      AZURE_ACR_NAME: acrunihomedev

    steps:
      - name: Checkout exacto de main aprobado por CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Confirmar que las credenciales federadas están configuradas
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID" || { echo '::error::Falta AZURE_CLIENT_ID en azure-dev'; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo '::error::Falta AZURE_TENANT_ID en azure-dev'; exit 1; }
          test -n "$AZURE_SUBSCRIPTION_ID" || { echo '::error::Falta AZURE_SUBSCRIPTION_ID en azure-dev'; exit 1; }

      - name: Autenticar Azure mediante OIDC (sin client secret)
        uses: azure/login@v2 # Fijar commit SHA al aprobar la integración definitiva
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preflight de recursos existentes (no crear infraestructura)
        id: preflight
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az group show -n "$AZURE_RESOURCE_GROUP" --query name -o tsv > /dev/null
          REGISTRY_SERVER="$(az acr show -n "$AZURE_ACR_NAME" -g "$AZURE_RESOURCE_GROUP" --query loginServer -o tsv)"
          test "$REGISTRY_SERVER" = "${AZURE_ACR_NAME}.azurecr.io" || { echo '::error::ACR inesperado'; exit 1; }
          EXISTING_IMAGE="$(az containerapp show -n "$AZURE_CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" --query 'properties.template.containers[0].image' -o tsv)"
          test -n "$EXISTING_IMAGE" || { echo '::error::No se encontró la imagen actual'; exit 1; }
          APP_FQDN="$(az containerapp show -n "$AZURE_CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" --query 'properties.configuration.ingress.fqdn' -o tsv)"
          test -n "$APP_FQDN" || { echo '::error::No se encontró el hostname HTTPS'; exit 1; }
          [[ "$APP_FQDN" =~ ^[a-zA-Z0-9.-]+$ ]] || { echo '::error::FQDN inválido'; exit 1; }
          MIN_REPLICAS="$(az containerapp show -n "$AZURE_CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" --query 'properties.template.scale.minReplicas' -o tsv)"
          if [[ "$MIN_REPLICAS" =~ ^[0-9]+$ ]] && [ "$MIN_REPLICAS" -lt 2 ]; then
            echo '::warning::Este entorno aún no garantiza dos réplicas; validar cumplimiento antes de producción.'
          fi
          echo "registry_server=$REGISTRY_SERVER" >> "$GITHUB_OUTPUT"
          echo "app_fqdn=$APP_FQDN" >> "$GITHUB_OUTPUT"
          echo "previous_image=$EXISTING_IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo '## Preflight Azure DEV'
            echo '- Recursos existentes comprobados; no se crean recursos.'
            echo '- Imagen anterior registrada para posible reversión manual.'
            echo '- Los secretos de la aplicación y la configuración de MongoDB no se modifican.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Construir imagen de main en runner (sin Docker local)
        id: image
        env:
          REGISTRY_SERVER: ${{ steps.preflight.outputs.registry_server }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY_SERVER}/unihome-api:sha-${GITHUB_SHA}"
          docker build --pull --tag "$IMAGE" .
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Publicar imagen en ACR existente
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_ACR_NAME" --only-show-errors
          docker push "$IMAGE"

      - name: Actualizar solamente imagen de Container Apps
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --only-show-errors > /dev/null

      - name: Comprobar imagen publicada y health checks HTTPS
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
          APP_FQDN: ${{ steps.preflight.outputs.app_fqdn }}
          PREVIOUS_IMAGE: ${{ steps.preflight.outputs.previous_image }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            ACTUAL="$(az containerapp show -n "$AZURE_CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" --query 'properties.template.containers[0].image' -o tsv)"
            if [[ "$ACTUAL" == "$IMAGE" ]] && \
               curl -fsS --connect-timeout 5 --max-time 15 "https://${APP_FQDN}/health/live" >/dev/null && \
               curl -fsS --connect-timeout 5 --max-time 15 "https://${APP_FQDN}/health/ready" >/dev/null; then
              {
                echo '## Deploy Azure DEV correcto'
                echo "- Imagen: \`${IMAGE}\`"
                echo "- Health: \`https://${APP_FQDN}/health/live\` y \`/health/ready\` respondieron OK."
                echo "- Imagen anterior (rollback manual): \`${PREVIOUS_IMAGE}\`"
                echo '- No se cambiaron secretos, variables ni número de réplicas.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          {
            echo '## Deploy Azure DEV requiere revisión'
            echo '- La revisión no pasó las comprobaciones de imagen y health durante la ventana de validación.'
            echo "- Imagen anterior para rollback manual: \`${PREVIOUS_IMAGE}\`"
            echo '- No se ejecutó reversión automática ni se cambió MongoDB.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo '::error::No se verificó salud de la nueva versión; revisar revisiones y considerar rollback manual autorizado.'
          exit 1
